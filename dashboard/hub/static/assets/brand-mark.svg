<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hub brand mark. Two even L brackets, top-left and bottom-right, 180deg rotational.
       margin 8 / thickness 12 / arm 32 units = 2 / 3 / 8 device px at 16px.
       Every edge is a multiple of 4, which is one device pixel at 16px. Do not respace
       off that grid or the glyph goes soft in the tab strip.

       The field is shaded top-left to bottom-right so a large tile reads as a lit
       surface rather than one flat block ending at an arbitrary edge. Only the FIELD
       is shaded; the white glyph stays hard-edged and grid-aligned, because a soft
       or offset glyph is what actually destroys the 16px favicon. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3568ee"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#12309a"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.24" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#field)"/>
  <rect width="64" height="64" fill="url(#lift)"/>
  <path d="M8 8 H40 V20 H20 V40 H8 Z M56 56 H24 V44 H44 V24 H56 Z" fill="#ffffff"/>
</svg>
