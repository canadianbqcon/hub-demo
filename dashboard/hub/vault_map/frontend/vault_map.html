<!-- no-flash: set theme + surface before first paint (mirrors jobs.html) -->
<script>
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub.theme");
      if (t === "glass") t = "liquid";
      r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
      if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
      var s = localStorage.getItem("hub.surface"); /* canonical key, shared across every hub page */
      if (s !== "light" && s !== "dark") {
        var old = localStorage.getItem("hub:surface"); /* migrate legacy colon key once */
        s = (old === "light" || old === "dark") ? old : "dark";
      }
      r.setAttribute("data-surface", s);
    } catch (e) { r.setAttribute("data-theme","cobalt"); r.setAttribute("data-surface","dark"); }
  })();
</script>
<title>vault map</title>

<!-- real theme fonts (all three; inert unless their data-theme is active) -->
<!-- webfonts: one same-origin, render-blocking stylesheet carrying BOTH themes'
     faces. Replaces the Google Fonts <link> this head used to inject from JS:
     cross-origin, a second hop for each woff2, discovered too late to block
     first paint, and `display=swap` — so the page painted in the fallback stack
     and reflowed when the real faces landed. That reflow was the load flash.
     Declaring the inactive theme's faces costs nothing (a @font-face downloads
     only when a rule uses the family) and makes a live theme switch fetch-free,
     which is why window.HUB_FONTS is gone — theme-switch.js no-ops without it.
     See static/vendor/fonts/fonts.css; regenerate with tools/vendor-fonts.py. -->
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
<script>
  /* Preload the ACTIVE theme's two latin faces. Without this they are not
     discovered until fonts.css has parsed AND layout has reached text that uses
     them — late enough on a slow link to paint a frame in the fallback stack and
     reflow, which is the flash. Two files, ~40 KB. data-theme is already set by
     the no-flash snippet above, which is why this sits after it. */
  (function () {
    var FACES = {
      cobalt: ["/static/vendor/fonts/archivo-black-normal-latin.woff2",
               "/static/vendor/fonts/space-grotesk-normal-latin.woff2"]
    };
    (FACES[document.documentElement.getAttribute("data-theme")] || []).forEach(function (href) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
      l.href = href;
      document.head.appendChild(l);
    });
  })();
</script>

<!-- real theme token contracts -->

<link rel="stylesheet" href="/static/css/components.css?v=5">

<style>
  /* ── function-color tokens, defined PER THEME so each theme tones the ten
       functions to its own register. quiet on vesper, electric on cobalt.
       containment-tree palette from the vault-map production design spec. ── */
  /* role hues spread around the wheel + two non-role utilities (misc=quiet, unclassified=alarm).
     families: ingest(warm in) · code+data(green/teal=the machine) · knowledge(blue=the mind)
     · config+governance(indigo/violet=control) · records(gold) · asset(magenta=media). */
  :root, [data-theme="vesper"][data-surface="dark"] {
    --fn-knowledge:#5b8bd0; --fn-ingest:#d8923f; --fn-code:#5fa86a; --fn-data:#3fa79c;
    --fn-config:#6f6fd0; --fn-governance:#9b6fd0; --fn-records:#b59b50; --fn-asset:#cf72ad;
    --fn-misc:#5d6470; --fn-unclassified:#e05569;
  }
  [data-theme="vesper"][data-surface="light"] {
    --fn-knowledge:#3b6ea5; --fn-ingest:#b06a1f; --fn-code:#3f7d4f; --fn-data:#2b7d76;
    --fn-config:#4f52b0; --fn-governance:#7a4fb0; --fn-records:#8a7434; --fn-asset:#a8478a;
    --fn-misc:#8a909c; --fn-unclassified:#c0354b;
  }
  [data-theme="cobalt"][data-surface="dark"] {   /* saturated — the brutalist shout */
    --fn-knowledge:#3d9bff; --fn-ingest:#ff9e3d; --fn-code:#2fd07a; --fn-data:#21c7c0;
    --fn-config:#6f7bff; --fn-governance:#b56bff; --fn-records:#d4b84a; --fn-asset:#ff6fc0;
    --fn-misc:#5a6a90; --fn-unclassified:#ff4d6a;
  }
  [data-theme="cobalt"][data-surface="light"] {
    --fn-knowledge:#1d5ed8; --fn-ingest:#c2670f; --fn-code:#1f9d57; --fn-data:#119089;
    --fn-config:#3a44d0; --fn-governance:#7d3fd0; --fn-records:#9a7d1a; --fn-asset:#c2358f;
    --fn-misc:#7a86a0; --fn-unclassified:#e01e44;
  }

  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:var(--font-body); font-size:var(--fs-subhead); line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* topbar */
  .topbar {
    display:flex; align-items:center; gap:var(--s-4,16px);
    padding:12px 18px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .topbar h1 {
    font-family:var(--font); font-weight:500; font-size:var(--fs-title); margin:0;
    letter-spacing:.01em; color:var(--fg);
  }
  .topbar .sub { font-size:var(--fs-footnote); color:var(--fg-faint); letter-spacing:.04em; }
  .spacer { flex:1 1 auto; }

  .tbtn {
    appearance:none; cursor:pointer; background:transparent;
    border:1px solid var(--line); border-radius:var(--r-card);
    color:var(--fg-dim); font-family:var(--font-body); font-size:var(--fs-footnote);
    letter-spacing:.06em; text-transform:lowercase; padding:6px 10px;
    transition:border-color 120ms,color 120ms,background 120ms;
  }
  .tbtn:hover { color:var(--fg); border-color:var(--accent-dim); background:var(--bg-elev); }

  /* intro strip — permanent vault description + color legend (orientation header) */
  .intro { padding:13px 18px 12px; border-bottom:1px solid var(--line-soft); flex:0 0 auto; }
  .intro .lead { font-size:var(--fs-footnote); color:var(--fg-mute); line-height:1.55; margin:0 0 10px; }
  .intro .lead b {
    font-family:var(--font); font-weight:500; font-size:var(--fs-body); color:var(--fg);
    letter-spacing:.01em; margin-right:2px;
  }
  .intro .leg { display:flex; gap:7px 18px; flex-wrap:wrap; font-size:var(--fs-caption); color:var(--fg-dim); }
  .intro .leg span { display:inline-flex; align-items:baseline; gap:7px; letter-spacing:.02em; }
  .intro .leg i { width:10px; height:10px; border-radius:2px; flex:0 0 auto; transform:translateY(1px); }
  .intro .leg b { color:var(--fg); font-weight:500; }
  .intro .leg em { font-style:normal; color:var(--fg-faint); }
  .intro .hidden-note { margin-top:9px; font-size:var(--fs-caption); color:var(--fg-faint); letter-spacing:.02em; font-style:italic; }
  .panel .aihint { margin-top:16px; padding:10px 12px; border:1px dashed var(--line); border-radius:var(--r-card);
    font-size:var(--fs-caption); line-height:1.5; color:var(--fg-faint); font-style:italic; }

  /* breadcrumb row: a static "path" label + the live drill trail + search,
     kept visually distinct from the topbar's static page crumb so the two
     don't read as competing breadcrumbs (one names the page, one the trail). */
  .crumbrow {
    display:flex; align-items:center; gap:14px;
    padding:8px 18px; border-bottom:1px solid var(--line-soft); flex:0 0 auto;
    min-height:34px;
  }
  .crumbs-label {
    font-size:var(--fs-caption); letter-spacing:.14em; text-transform:uppercase;
    color:var(--fg-faint); flex:0 0 auto;
  }
  .crumbs {
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:var(--fs-footnote); color:var(--fg-dim); flex:1 1 auto; min-width:0;
  }
  .crumbs .c { cursor:pointer; color:var(--fg-dim); white-space:nowrap; }
  .crumbs .c:hover { color:var(--fg); text-decoration:underline; }
  .crumbs .c.here { color:var(--fg); }
  .crumbs .sepc { color:var(--fg-ghost); }

  /* typeahead: client-side filter over the already-loaded NODES array */
  .search-wrap { position:relative; flex:0 0 auto; }
  .search-input {
    appearance:none; background:var(--bg); border:1px solid var(--line);
    border-radius:var(--r-card); color:var(--fg); font-family:var(--font-body);
    font-size:var(--fs-footnote); padding:6px 10px; width:220px;
  }
  .search-input::placeholder { color:var(--fg-faint); }
  .search-results {
    position:absolute; top:calc(100% + 4px); right:0; width:320px; max-height:360px;
    overflow-y:auto; background:var(--bg-elev); border:1px solid var(--line);
    border-radius:var(--r-card); box-shadow:var(--modal-shadow); z-index:20;
  }
  .search-results .sr-item {
    display:flex; align-items:center; gap:8px; padding:7px 12px; cursor:pointer;
    font-size:var(--fs-footnote); color:var(--fg); border-bottom:1px solid var(--line-soft);
  }
  .search-results .sr-item:last-child { border-bottom:none; }
  .search-results .sr-item:hover, .search-results .sr-item:focus-visible { background:var(--bg-hover); }
  .search-results .sr-path {
    color:var(--fg-faint); font-size:var(--fs-caption); margin-left:auto; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; max-width:150px;
  }
  .search-results .sr-empty { padding:10px 12px; font-size:var(--fs-footnote); color:var(--fg-faint); }

  /* body: columns + panel */
  .stage { display:flex; flex:1 1 auto; min-height:0; }
  .map { display:flex; flex:1 1 auto; overflow-x:auto; overflow-y:hidden; min-width:0; }

  .col {
    flex:0 0 268px; width:268px; height:100%; overflow-y:auto;
    border-right:1px solid var(--line); padding:6px 0;
  }
  .col-head {
    font-size:var(--fs-caption); letter-spacing:.14em; text-transform:uppercase;
    color:var(--fg-faint); padding:4px 14px 8px; font-family:var(--font-body);
  }

  /* repo section headers inside the merged first column */
  .repo-group {
    display:flex; flex-direction:column; gap:2px; cursor:pointer;
    padding:10px 12px; border-top:1px solid var(--line-strong);
    border-bottom:1px solid var(--line);
    box-shadow: inset 3px 0 0 0 var(--fn);
    background: color-mix(in srgb, var(--fn) 22%, var(--bg));
    transition:background 90ms ease-out;
  }
  .repo-group:hover { background: color-mix(in srgb, var(--fn) 32%, var(--bg)); }
  .repo-group.lit, .repo-group.sel { background: color-mix(in srgb, var(--fn) 42%, var(--bg)); }
  .repo-group .rg-name { font-family:var(--font); font-size:var(--fs-body); color:var(--fg); letter-spacing:.01em; }
  .repo-group .rg-meta { font-size:var(--fs-caption); color:var(--fg-faint); letter-spacing:.03em; font-variant-numeric:tabular-nums; }

  .row {
    display:flex; align-items:center; gap:8px;
    padding:7px 12px 7px 13px; cursor:pointer; position:relative;
    border-bottom:1px solid var(--line-soft);
    transition:background 90ms ease-out;
  }
  .row:hover { background:var(--bg-hover); }
  .row.lit { background:var(--bg-elev); }
  .row.sel { background:var(--bg-elev-2); }
  .row .nm {
    flex:1 1 auto; min-width:0; font-size:var(--fs-footnote); color:var(--fg);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* redundant non-color function cue — a two-letter tag so meaning survives
     without reading hue (WCAG 1.4.1); title attr adds the full name on hover. */
  .row .fnlabel, .repo-group .fnlabel {
    flex:0 0 auto; width:20px; text-align:center; font-size:var(--fs-caption);
    letter-spacing:.02em; text-transform:uppercase; color:var(--fg-dim); opacity:.85;
  }
  .repo-group .rg-line { display:flex; align-items:baseline; gap:8px; }
  .row .ct { font-size:var(--fs-caption); color:var(--fg-dim); font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .row .chev { font-size:var(--fs-caption); color:var(--fg-ghost); flex:0 0 auto; width:8px; text-align:center; }
  .row.file .nm { color:var(--fg-mute); }
  /* provenance: tool-generated / derived files recede (the .git & cache noise) */
  .row.gen { opacity:.62; }
  .row.gen .nm { font-style:italic; }
  .row.gen.lit, .row.gen.sel { opacity:.78; }

  /* ── FILL — function color tints the whole row, solid left edge ── */
  .row {
    background: color-mix(in srgb, var(--fn) 16%, var(--bg));
    box-shadow: inset 3px 0 0 0 var(--fn);
  }
  .row:hover { background: color-mix(in srgb, var(--fn) 26%, var(--bg)); }
  .row.lit   { background: color-mix(in srgb, var(--fn) 30%, var(--bg)); }
  .row.sel   { background: color-mix(in srgb, var(--fn) 44%, var(--bg)); }

  /* right info panel */
  .panel {
    flex:0 0 320px; width:320px; height:100%; overflow-y:auto;
    border-left:1px solid var(--line); padding:20px 20px 40px;
    background:var(--bg-elev);
  }
  .panel .pfn {
    display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-caption);
    letter-spacing:.1em; text-transform:uppercase; color:var(--fg-dim); margin-bottom:14px;
  }
  .panel .dot { width:10px; height:10px; border-radius:var(--r-pill,999px); background:var(--fn); flex:0 0 auto; }
  .panel h2 {
    font-family:var(--font); font-weight:500; font-size:var(--fs-title); line-height:1.15;
    margin:0 0 4px; color:var(--fg); word-break:break-word;
  }
  .panel .kind { font-size:var(--fs-footnote); color:var(--fg-faint); letter-spacing:.04em; margin-bottom:18px; }
  .panel .purpose { font-size:var(--fs-body); color:var(--fg-mute); line-height:1.6; margin:0 0 22px; }
  .panel .meta-grid { display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:var(--fs-footnote); }
  .panel .meta-grid dt { color:var(--fg-faint); letter-spacing:.04em; }
  .panel .meta-grid dd { margin:0; color:var(--fg-mute); font-variant-numeric:tabular-nums; word-break:break-word; }
  .panel .pathline { margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft);
    font-size:var(--fs-caption); color:var(--fg-faint); line-height:1.5; }
  .panel .pathline .pathtext { display:block; margin-top:6px; word-break:break-all; }
  .panel.empty { color:var(--fg-faint); display:flex; align-items:center; justify-content:center; text-align:center; font-size:var(--fs-footnote); }

  /* loading / error states inside the map area (fetch has no native fallback) */
  .map-status { padding:16px 18px; font-size:var(--fs-footnote); color:var(--fg-faint); }
  .map .hub-error { margin:16px 18px; }

  @media (prefers-reduced-motion: reduce) { .row { transition:none; } }

  /* mobile: the panel's flex:0 0 320px never shrinks (flex-shrink:0), so on a
     390px viewport it eats 320px of the row and squeezes .map to a ~70px
     sliver. Stack panel below the map instead; .map keeps its own
     overflow-x:auto so the Miller columns scroll horizontally *inside* it,
     not the page. */
  @media (max-width:900px) {
    .stage { flex-direction:column; }
    .map { flex:1 1 auto; min-height:0; }
    .col { flex:0 0 min(268px,88vw); width:min(268px,88vw); }
    .panel {
      flex:0 0 auto; width:100%; max-height:38vh;
      border-left:none; border-top:1px solid var(--line);
    }
    /* the orientation paragraph + full 10-item legend measure ~440px on a
       390×844 phone (verified live) — that alone starves .map to 0 height
       even with the stack fix above. Collapse to a compact, horizontally-
       scrollable badge strip (color still there, meaning still on row
       .title on tap-hold); drop the prose, it's re-shown on desktop. */
    .intro { padding:8px 14px; }
    .intro .lead, .intro .hidden-note { display:none; }
    .intro .leg { flex-wrap:nowrap; overflow-x:auto; gap:14px; padding-bottom:2px; }
    .intro .leg span { flex:0 0 auto; }
    .intro .leg em { display:none; }

    /* touch targets: 30-34px rows/headers are fine for a mouse-driven dense
       Miller-columns browser but miss the ~44px touch guideline (WCAG 2.5.5)
       on a phone. Vertical-only padding bump, mobile breakpoint scoped —
       desktop density is untouched. */
    .row { padding-top:15px; padding-bottom:15px; }
    .repo-group { padding-top:14px; padding-bottom:14px; }
  }
</style>
</head>

<script defer src="/jsx/vault_map/frontend/static/vault_map.jsx?v=1"></script>
<script>
/* fallback outside React: if the body never mounted, say so instead of a blank page */
window.addEventListener("load", function () {
  setTimeout(function () {
    if (document.querySelector('[data-react-mounted="vault-map"]')) return;
    var r = document.getElementById("vm-root");
    r.style.display = "block";
    r.innerHTML = '<div class="hub-error">page failed to load</div>';
  }, 3000);
});
</script>
