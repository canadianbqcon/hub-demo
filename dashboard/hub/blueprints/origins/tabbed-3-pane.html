<div class="hub-shell hub-t3p">

  <header class="topbar">
    <div class="topbar-l">
      <a class="brand-stack brand-link" href="/" aria-label="home">
        <span class="brand-wordmark"></span>
        <span class="brand-slogan"></span>
      </a>
      <button type="button" class="hub-t3p-nav-toggle" aria-expanded="false" aria-label="sections">
        <svg class="hub-t3p-nav-toggle-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div class="crumb-block">
        <span class="crumb"></span>
        <span class="hub-t3p-crumb-section"></span>
      </div>
    </div>
    <div class="topbar-r">
      <button type="button" class="surface-toggle surface-toggle-icon" title="light / dark"></button>
    </div>
  </header>

  <div class="body hub-t3p-body">

    <section class="col hub-t3p-col funnel hub-t3p-rail">
      <nav class="hub-nav-rail">
        <button type="button" class="hub-t3p-tab hub-nav-item active">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
      </nav>
    </section>

    <section class="col hub-t3p-col hub-t3p-pane">
      <div class="hub-pane-head hub-t3p-head"></div>
      <div class="hub-split hub-t3p-split">

        <div class="hub-pane-col hub-t3p-list-col">
          <div class="hub-pane-list hub-t3p-list">
            <div class="hub-t3p-card hub-plate-card">
              <div class="hub-section-head">
                <span class="hub-section-head-t"></span>
                <span class="hub-section-head-sum"></span>
              </div>
            </div>
            <div class="hub-t3p-stack">
              <div class="hub-t3p-card hub-plate-card">
                <div class="hub-section-head">
                  <span class="hub-section-head-t"></span>
                  <span class="hub-section-head-sum"></span>
                  <!-- biome-ignore lint/a11y/useAnchorContent: structural skeleton, content injected at runtime -->
                  <a class="hub-section-head-act lgroup-act"></a>
                  <button type="button" class="hub-section-head-act lgroup-act"></button>
                </div>
              </div>
              <div class="hub-t3p-card hub-plate-card">
                <div class="hub-section-head">
                  <span class="hub-section-head-t"></span>
                  <span class="hub-section-head-sum"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="hub-t3p-side">
          <section class="hub-detail-rail hub-slide-over">
            <button type="button" class="hub-slide-over-close"></button>
            <div class="hub-detail-rail-inner hub-t3p-context">
              <div class="hub-detail-card">
                <div class="hub-detail-card-head"></div>
                <div class="hub-kv-row"><span></span><b></b></div>
                <div class="hub-kv-row"><span></span><b></b></div>
              </div>
              <div class="hub-detail-card">
                <div class="hub-detail-card-head"></div>
                <div class="hub-callout-warn"><b></b></div>
              </div>
            </div>
          </section>
        </div>

      </div>
    </section>

  </div>

  <div class="hub-t3p-scrim" hidden></div>

  <footer class="status hub-t3p-status">
    <span class="status-l"></span>
    <span class="status-r"></span>
  </footer>

</div>
