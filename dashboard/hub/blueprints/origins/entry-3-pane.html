<div class="hub-shell hub-e3p">

  <header class="topbar">
    <div class="topbar-l">
      <button type="button" class="hub-back" title="back" aria-label="back"></button>
      <a class="brand-stack brand-link" href="/" aria-label="home">
        <span class="brand-wordmark"></span>
        <span class="brand-slogan"></span>
      </a>
      <div class="crumb-block">
        <span class="crumb"></span>
      </div>
    </div>
    <div class="topbar-r">
      <button type="button" class="surface-toggle surface-toggle-icon" title="light / dark"></button>
    </div>
  </header>

  <main class="body hub-e3p-body">

    <section class="col hub-e3p-list-col">
      <div class="hub-e3p-tools">
        <input type="text" aria-label="search">
      </div>
      <div class="hub-e3p-entries" role="listbox">
        <div class="hub-e3p-group" role="presentation"><span class="hub-e3p-group-n"></span></div>
        <div class="hub-e3p-entry active" role="option" aria-selected="true" tabindex="0"><span class="hub-e3p-entry-mark"></span><span class="hub-e3p-entry-t"></span><span class="hub-e3p-entry-s"></span><span class="hub-e3p-entry-v"></span></div>
        <div class="hub-e3p-entry" role="option" aria-selected="false" tabindex="-1"><span class="hub-e3p-entry-mark"></span><span class="hub-e3p-entry-t"></span><span class="hub-e3p-entry-s"></span><span class="hub-e3p-entry-v"></span></div>
        <div class="hub-e3p-entry" role="option" aria-selected="false" tabindex="-1"><span class="hub-e3p-entry-mark"></span><span class="hub-e3p-entry-t"></span><span class="hub-e3p-entry-s"></span><span class="hub-e3p-entry-v"></span></div>
        <div class="hub-e3p-group" role="presentation"><span class="hub-e3p-group-n"></span></div>
        <div class="hub-e3p-entry" role="option" aria-selected="false" tabindex="-1"><span class="hub-e3p-entry-mark"></span><span class="hub-e3p-entry-t"></span><span class="hub-e3p-entry-s"></span><span class="hub-e3p-entry-v"></span></div>
        <div class="hub-e3p-entry" role="option" aria-selected="false" tabindex="-1"><span class="hub-e3p-entry-mark"></span><span class="hub-e3p-entry-t"></span><span class="hub-e3p-entry-s"></span><span class="hub-e3p-entry-v"></span></div>
      </div>
    </section>

    <section class="col hub-e3p-pane">
      <div class="hub-e3p-bar">
        <button type="button" class="hub-e3p-back"><span aria-hidden="true"></span></button>
        <span class="hub-e3p-pos"></span>
        <button type="button" class="hub-e3p-nav" aria-label="previous" disabled></button>
        <button type="button" class="hub-e3p-nav" aria-label="next"></button>
      </div>

      <div class="hub-split hub-e3p-split">
        <div class="hub-e3p-main">

          <div class="hub-e3p-head">
            <div class="hub-e3p-head-row">
              <span tabindex="-1"><span class="hub-e3p-head-sub"></span><span class="hub-e3p-head-sep" aria-hidden="true"></span><span class="hub-e3p-head-t"></span></span>
              <div class="hub-e3p-head-acts">
                <!-- biome-ignore lint/a11y/useAnchorContent: structural skeleton, content injected at runtime -->
                <a></a>
                <!-- biome-ignore lint/a11y/useAnchorContent: structural skeleton, content injected at runtime -->
                <a></a>
              </div>
            </div>
            <div class="hub-tabs hub-e3p-stages">
              <button type="button" class="hub-tab active is-done"><span class="hub-e3p-stage-dot" aria-hidden="true"></span><span class="hub-e3p-stage-sub"></span></button>
              <button type="button" class="hub-tab is-done"><span class="hub-e3p-stage-dot" aria-hidden="true"></span><span class="hub-e3p-stage-sub"></span></button>
              <button type="button" class="hub-tab is-now"><span class="hub-e3p-stage-dot" aria-hidden="true"></span><span class="hub-e3p-stage-sub"></span></button>
              <button type="button" class="hub-tab"><span class="hub-e3p-stage-dot" aria-hidden="true"></span><span class="hub-e3p-stage-sub"></span></button>
              <button type="button" class="hub-tab is-apart"><span class="hub-e3p-stage-dot" aria-hidden="true"></span><span class="hub-e3p-stage-sub"></span></button>
            </div>
          </div>

          <div class="hub-e3p-cards">
            <div class="hub-e3p-empty" hidden></div>
            <div class="hub-plate-card">
              <div class="hub-section-head">
                <span class="hub-section-head-t"></span>
                <span class="hub-section-head-sum"></span>
              </div>
            </div>
            <div class="hub-plate-card">
              <div class="hub-section-head">
                <span class="hub-section-head-t"></span>
                <span class="hub-section-head-sum"></span>
              </div>
            </div>
            <div class="hub-plate-card">
              <div class="hub-section-head">
                <span class="hub-section-head-t"></span>
                <span class="hub-section-head-sum"></span>
              </div>
            </div>
          </div>
        </div>

        <section class="col hub-detail-rail hub-e3p-rail"></section>
      </div>
    </section>

  </main>

  <footer class="status">
    <span class="clock"></span>
    <span></span>
    <span class="src"></span>
  </footer>

</div>
