<div class="hub-shell hub-t3p">

  <header class="topbar">
    <div class="topbar-l">
      <a class="brand-stack brand-link" href="/" aria-label="home">
        <span class="brand-wordmark"></span>
        <span class="brand-slogan"></span>
      </a>
      <button type="button" class="hub-t3p-nav-toggle" aria-expanded="false" aria-label="sections">
        <svg class="hub-t3p-nav-toggle-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div class="crumb-block">
        <span class="crumb"></span>
        <span class="hub-t3p-crumb-section"></span>
      </div>
    </div>
    <div class="topbar-r">
      <button type="button" class="surface-toggle surface-toggle-icon"></button>
    </div>
  </header>

  <div class="body hub-t3p-body">

    <section class="col hub-t3p-col funnel hub-t3p-rail">
      <nav class="hub-nav-rail">
        <button type="button" class="hub-t3p-tab hub-nav-item active">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"></svg></span>
        </button>
      </nav>
    </section>

    <section class="col hub-t3p-col hub-trd-pane is-reading">
      <div class="hub-trd-shelf">
        <button type="button" class="hub-trd-row active"><span class="hub-trd-row-t"></span><span class="hub-trd-row-s"></span><span class="hub-pill"></span></button>
        <button type="button" class="hub-trd-row"><span class="hub-trd-row-t"></span><span class="hub-trd-row-s"></span><span class="hub-pill"></span></button>
        <button type="button" class="hub-trd-row"><span class="hub-trd-row-t"></span><span class="hub-trd-row-s"></span><span class="hub-pill"></span></button>
      </div>
      <div class="hub-trd-reader">
        <div class="hub-trd-bar">
          <button type="button" class="hub-trd-back" aria-label="back to list"></button>
          <button type="button" class="hub-trd-toggle" aria-label="show list" aria-expanded="false"></button>
          <h1 class="hub-trd-title"></h1>
          <span><span class="hub-pill"></span></span>
          <div class="hub-trd-acts"><button type="button" class="hub-btn hub-btn--accent"></button><button type="button" class="hub-btn hub-btn--danger"></button></div>
        </div>
        <div class="hub-trd-strip" hidden><div class="hub-field"><label></label><textarea></textarea></div><div class="hub-btn-row"><button type="button" class="hub-btn hub-btn--accent"></button><button type="button" class="hub-btn"></button></div></div>
        <div class="hub-trd-body"><div class="hub-trd-measure"><h1></h1>
<p></p><p></p></div></div>
      </div>
      <div class="hub-trd-scrim" hidden></div>
    </section>

  </div>

  <div class="hub-t3p-scrim" hidden></div>

  <footer class="status hub-t3p-status">
    <span class="status-l"></span>
    <span class="status-r"></span>
  </footer>

</div>
