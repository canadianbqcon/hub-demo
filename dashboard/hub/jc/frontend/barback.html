<script defer src="/hub-modules.js"></script><script defer src="/static/js/theme-switch.js?v=42"></script><script defer src="/jsx/static/js/topbar.jsx"></script><style>:root{color-scheme:light}body{margin:0;padding:0;font:var(--fs-footnote) -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Juniper & Co Bar Back</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Juniper & Co — committed to the bar's own world: deep juniper ground, off-white ink,
   typewriter display, Work Sans body, and recipe cards as printed-menu paper. Single theme by choice. */
:root{
  --bg:#114038; --bg-deep:#0c2f2a; --bg-raise:#17514a; --line:rgba(244,244,238,.16); --line-strong:rgba(244,244,238,.32);
  --ink:#f4f4ee; --ink-dim:rgba(244,244,238,.68); --ink-faint:rgba(244,244,238,.42); --white:#fff;
  --brass:#c8934a; --brass-deep:#985d22; --red:#d30404; --amber:#e0a43a; --good:#7fc48b;
  --paper:#f7f6ef; --paper-ink:#1f3a32; --paper-dim:#5c6e66; --paper-line:#cfd3c6;
  --display:"Special Elite","Courier Prime","Courier New",monospace; --body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Lora",Georgia,"Times New Roman",serif;
  --r:6px; --tap:44px;
}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
/* no pinch, no double-tap zoom, and no 300ms tap delay: this is a shift tool, not a document */
html,body{touch-action:pan-x pan-y}
button,input,select,summary,a{touch-action:manipulation}
body{margin:0;background:transparent;color:var(--ink);font:400 var(--fs-subhead)/1.4 var(--body);letter-spacing:.01em;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,h4,h5{margin:0;font-weight:400}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
/* Hub top bar, J&Co colours. Specificity (0,2,1) beats every theme's (0,2,0) token block, so the
   bar, launcher and theme panel paint juniper/brass whichever Hub theme is picked, and the tokens the
   Hub shares with this page (--bg, --line, --line-strong, --r) keep this page's values. */
html[data-theme][data-surface]{
  --bg:#114038; --line:rgba(244,244,238,.16); --line-strong:rgba(244,244,238,.32); --r:6px;
  --bg-elev:#17514a; --bg-elev-2:#1d5f57; --line-soft:rgba(244,244,238,.1);
  --fg:#f4f4ee; --fg-dim:rgba(244,244,238,.68); --fg-faint:rgba(244,244,238,.42); --fg-ghost:rgba(244,244,238,.24);
  --accent:#c8934a; --accent-dim:#985d22; --accent-faint:rgba(200,147,74,.18);
  --font:"Special Elite","Courier New",monospace; --font-display:"Special Elite","Courier New",monospace; --font-body:"Work Sans",system-ui,sans-serif;
  --launch-scrim:rgba(12,47,42,.6); --modal-shadow:0 8px 32px rgba(0,0,0,.45); --chrome:#0c2f2a; --bg-hover:#1d5f57;
  /* Liquid Glass in juniper: wallpaper glows juniper and brass, glass fills tint juniper instead of graphite */
  --lg-wall-base:#0a2622; --lg-hue-1:31 140 112; --lg-hue-2:200 147 74; --lg-hue-3:60 170 140;
  --lg-wall-a1:.5; --lg-wall-a2:.3; --lg-wall-a3:.25;
  --lg-fill:rgba(17,64,56,var(--lg-fill-a)); --lg-thick-fill:rgba(17,64,56,.55);
  --lg-ov-fill:rgba(17,64,56,.72); --lg-row-on:rgba(200,147,74,.18);
}
.topbar .sync{white-space:nowrap}
.topbar{position:sticky;top:0;z-index:40}
/* The sorrel replaces the Hub mark and wordmark; the link still goes home. html+.topbar outranks
   theme-switch.js's injected sheet, which loads after this one. */
html .topbar .brand-stack.brand-link{padding-left:40px;min-height:40px}
html .topbar .brand-stack.brand-link::before{width:36px;height:36px;border-radius:0;background:url(/jc/static/juniper.svg) center/contain no-repeat}
html .topbar .brand-wordmark,html .topbar .brand-slogan{display:none}
/* The launcher is a bar-height square (aspect-ratio:1). With the bar in a plain block, not a grid, its
   height is not definite at layout time, so the button was sized ~20px wide and drawn 51px, hanging off
   the right edge. Pinned to 44px here; the ledger had the same fault and took the grid fix. */
html .topbar .launcher.launcher-icon.module-launcher{width:44px;height:44px;aspect-ratio:auto;flex:none;align-self:center}
.sync{margin-left:auto;font:500 var(--fs-caption)/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:7px 10px;border:1px solid var(--line-strong);border-radius:999px;color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
.sync.live{color:var(--ink)} .sync.live::before{background:var(--good);box-shadow:0 0 0 3px rgba(127,196,139,.25)}
.sync.offline::before{background:var(--amber)}

/* who is on shift — the initials stamped on every write */
.who{margin-left:auto;font-family:var(--display);text-transform:uppercase;font-size:var(--fs-subhead);line-height:1;padding:9px 12px;border:1px solid var(--brass);border-radius:999px;color:var(--brass);white-space:nowrap;min-height:34px}
.who ~ .sync{margin-left:0}
/* the initials earn their place in the bar; on a phone the sync chip keeps only its dot */
@media (max-width:560px){.sync{font-size:0;letter-spacing:0;gap:0;padding:9px}}
.by{display:none;flex:none;font:500 var(--fs-caption)/1 var(--body);letter-spacing:.1em;color:var(--brass);border:1px solid rgba(200,147,74,.45);border-radius:999px;padding:3px 6px;white-space:nowrap}
/* the dialog is the whole screen and paints it: ::backdrop alone let the board read through */
#gate{border:0;padding:0;margin:0;width:100%;max-width:none;height:100%;max-height:none;background:var(--bg);color:var(--ink)}
#gate::backdrop{background:var(--bg)}
.gate-card{max-width:400px;margin:0 auto;padding:15vh 20px 20px;display:flex;flex-direction:column;gap:14px}
.gate-card h2{font-family:var(--display);text-transform:uppercase;letter-spacing:-.01em;font-size:var(--fs-large-title);line-height:.95}
.gate-card h2::before{content:"Juniper & Co";display:block;font:500 var(--fs-caption)/1 var(--body);letter-spacing:.2em;color:var(--brass);margin-bottom:10px}
.gate-card p{color:var(--ink-dim);font-size:var(--fs-subhead);line-height:1.45}
.gate-in::placeholder{color:#c4c4c4}
.gate-in{min-height:60px;padding:10px 16px;background:var(--white);color:#000;border:1px solid rgba(0,0,0,.12);font-family:var(--display);font-size:var(--fs-large-title);letter-spacing:.12em;text-align:center;text-transform:uppercase}
.gate-err{color:var(--amber);font-size:var(--fs-footnote);min-height:1.3em}

/* tabs: bottom bar on phones, top row on wide screens */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg-deep);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;font-family:var(--display);text-transform:uppercase;letter-spacing:-.01em;font-size:var(--fs-footnote);color:var(--ink-dim);position:relative;text-align:center;padding:6px 2px}
.tab.is-on{color:var(--ink)} .tab.is-on::after{content:"";position:absolute;left:18%;right:18%;top:0;height:2px;background:var(--brass)}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font:600 var(--fs-caption)/16px var(--body);text-align:center;letter-spacing:0}
@media (min-width:720px){
  body{padding-bottom:40px}
  #tabs{position:static;background:none;border:0;border-bottom:1px solid var(--line);max-width:760px;margin:0 auto;padding:0 16px}
  .tab{min-height:52px;flex-direction:row;justify-content:center;font-size:var(--fs-subhead);gap:8px;padding:0 6px}
  .tab.is-on::after{top:auto;bottom:-1px;left:6px;right:6px}
  .badge{position:static;margin-left:2px}
}

/* tab header — the printed menu's rotated sidebar band, echoed as an eyebrow */
.tab-head{padding:22px 0 14px;position:relative}
.tab-head h2{font-family:var(--display);text-transform:uppercase;letter-spacing:-.01em;font-size:var(--fs-large-title);line-height:.95;text-wrap:balance}
.tab-head h2::before{content:"Juniper & Co";display:block;font:500 var(--fs-caption)/1 var(--body);letter-spacing:.2em;color:var(--brass);margin-bottom:10px}
.lede{margin-top:12px;color:var(--ink-dim);max-width:60ch;font-size:var(--fs-subhead)}
.daystrip{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.daylabel{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.dayselect{margin-left:auto;background:var(--bg-raise);border:1px solid var(--line-strong);border-radius:var(--r);min-height:var(--tap);padding:8px 10px;font-size:var(--fs-footnote);color:var(--ink);max-width:100%}
.weekbar{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:30px repeat(7,1fr);grid-template-rows:auto 150px;gap:4px 6px}
.wk-head{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);text-align:center;white-space:nowrap;padding-bottom:4px}
.wk-head.is-today{color:var(--brass)}
.wk-head.is-on{color:var(--ink)}
.wk-axis{position:relative;grid-row:2}
.wk-axis span{position:absolute;right:0;transform:translateY(-1px);font:500 var(--fs-caption)/1 var(--body);color:var(--ink-faint)}
.wk-col{position:relative;border:1px solid var(--line);border-radius:var(--r);background:repeating-linear-gradient(to bottom,transparent 0 calc(100%/3.5 - 1px),var(--line) calc(100%/3.5 - 1px) calc(100%/3.5));cursor:pointer;padding:0;min-width:0}
.wk-col.is-past{opacity:.5}
.wk-col.is-on{border-color:var(--brass);background-color:rgba(200,147,74,.14);opacity:1}
.wk-blk{position:absolute;left:4px;right:4px;border-radius:5px;background:var(--brass);color:var(--bg-deep);display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 0;font:600 var(--fs-caption)/1 var(--body)}
.wk-off{position:absolute;inset:0;display:grid;place-items:center;font:500 var(--fs-caption)/1 var(--body);color:var(--ink-faint)}
@media (max-width:719px){.weekbar{grid-template-columns:22px repeat(7,1fr);gap:4px 3px;grid-template-rows:auto 130px}.wk-head{font-size:var(--fs-caption);letter-spacing:.02em;white-space:normal}.wk-blk{font-size:var(--fs-caption);left:2px;right:2px}.wk-off{font-size:var(--fs-caption)}.wk-axis span{font-size:var(--fs-caption)}}

/* section heads */
.sec-head,.cat-head,.phase-head,.area-head,.need-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-family:var(--display);text-transform:uppercase;letter-spacing:-.005em;font-size:var(--fs-body);padding:18px 0 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.area-head{font-size:var(--fs-title);border-bottom-width:2px;border-color:var(--line-strong);margin-top:14px}
.sec-count{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.1em;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec-count.warn{color:var(--amber)}
.shelf-head,.tier-head,.shelf-name,.sweep-area,.spec-h{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);padding:14px 0 6px}
.shelf-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.shelf-tag{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);border:1px solid var(--line-strong);border-radius:999px;padding:4px 9px;white-space:nowrap}
.hint{color:var(--ink-faint);font-size:var(--fs-footnote);margin:6px 0 4px}
.empty{color:var(--ink-dim);padding:22px 0;font-style:italic;font-family:var(--serif)}

/* rows */
.row{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:var(--tap);padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-size:var(--fs-subhead);line-height:1.3;display:flex;gap:8px;align-items:baseline}
.row-detail{font-size:var(--fs-footnote);color:var(--ink-dim);line-height:1.35}
.stepno{font:400 var(--fs-caption)/1 var(--display);color:var(--brass);min-width:1.6em;flex:none;font-variant-numeric:tabular-nums}
.duty .tick{flex:none;width:22px;height:22px;border:1.5px solid var(--line-strong);border-radius:50%;margin-top:1px;position:relative;transition:background .15s,border-color .15s}
.duty.is-done .tick{background:var(--brass);border-color:var(--brass)}
.duty.is-done .tick::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.duty.is-done .row-title{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.duty.is-red .stepno{color:var(--red)}
.duty.small{min-height:40px;padding:8px 0}
.duty:disabled{opacity:.8}
.deadline{flex:none;font:400 var(--fs-caption)/1 var(--display);color:var(--amber);padding:4px 7px;border:1px solid rgba(224,164,58,.45);border-radius:var(--r);margin-top:2px;white-space:nowrap}

/* low boy fill */
.fill{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--bg-deep);margin-bottom:22px}
.fill > summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 12px;padding:14px 16px;min-height:var(--tap)}
.fill > summary::-webkit-details-marker{display:none}
.fill > summary::after{content:"+";order:2;font-family:var(--display);font-size:var(--fs-title);line-height:1;color:var(--brass)} .fill[open] > summary::after{content:"–"}
.fill-title{order:1;font-family:var(--display);text-transform:uppercase;font-size:var(--fs-body);letter-spacing:-.005em}
.fill-tally{order:3;flex:1 0 100%;font:500 var(--fs-caption)/1.3 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);text-align:left}
.fill-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.fillrow{align-items:center;padding:0}
.fill-main{flex:1;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 0}
.fill-main .row-title{flex:1}
.fill-main .row-detail{flex:0 1 auto;max-width:40%;text-align:right}
.count{flex:none;min-width:36px;height:32px;border-radius:var(--r);font:400 var(--fs-body)/32px var(--display);text-align:center;color:var(--bg);background:var(--brass);visibility:hidden;font-variant-numeric:tabular-nums}
.fillrow.is-counted .count{visibility:visible}
.row-clear{flex:none;width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--ink-dim);font-size:var(--fs-subhead);border-radius:var(--r)} .row-clear.is-idle{visibility:hidden} .row-clear:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.sweep{margin-top:20px;padding:4px 14px 14px;border:1px dashed var(--line-strong);border-radius:var(--r)}
.sweep-head{font-family:var(--display);text-transform:uppercase;font-size:var(--fs-body);padding:12px 0 2px}
.sweep-line{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:1px solid var(--line)}
.sweep-n{font:400 var(--fs-subhead)/1 var(--display);color:var(--brass);min-width:2.2em;font-variant-numeric:tabular-nums}
.sweep-name{flex:1} .sweep-loc{font-size:var(--fs-caption);color:var(--ink-dim);text-align:right}
.sweep-clear{margin-top:14px}

/* buttons, chips, controls */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap);padding:10px 20px;border:1px solid var(--ink);border-radius:var(--r);font-family:var(--display);text-transform:uppercase;letter-spacing:-.02em;font-size:var(--fs-subhead);color:var(--ink);background:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.08)} .btn.ghost{border-color:var(--line-strong);color:var(--ink-dim)} .btn.small{min-height:36px;padding:6px 14px;font-size:var(--fs-footnote)}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:var(--fs-footnote);line-height:1.2;color:var(--ink);white-space:normal}
.chip.direct{color:var(--ink-dim)} .chip.multi{border-color:var(--brass);color:var(--brass)}
.chip.item{background:rgba(255,255,255,.05)} .chip-note{color:var(--ink-faint);font-size:var(--fs-caption)}
.chip.sel{background:var(--bg-raise);padding-right:4px} .chip-x{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;color:var(--ink-dim)} .chip-x:hover{color:var(--ink);background:rgba(255,255,255,.1)}
.chipwall{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 10px}
.controls{display:flex;gap:10px;align-items:center;margin:14px 0 8px;flex-wrap:wrap}
.search{flex:1;min-width:160px;min-height:var(--tap);padding:8px 14px;background:var(--white);color:#000;border:1px solid rgba(0,0,0,.12);border-radius:0;font-size:var(--fs-subhead)}
.search::placeholder{color:#777}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden;flex:none}
.seg-btn{min-height:var(--tap);padding:0 14px;font-family:var(--display);text-transform:uppercase;font-size:var(--fs-footnote);color:var(--ink-dim);border-right:1px solid var(--line-strong)} .seg-btn:last-child{border-right:0}
.seg-btn.is-on{background:var(--ink);color:var(--bg)}
.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:10px}
.subtab{padding:12px 0 10px;font-family:var(--display);text-transform:uppercase;font-size:var(--fs-subhead);color:var(--ink-dim);border-bottom:2px solid transparent;margin-bottom:-1px} .subtab.is-on{color:var(--ink);border-color:var(--brass)}

/* recipes — list rows on green, opened card as printed-menu paper */
.rrow{align-items:center} .rrow .chip{flex:none}
.chev{flex:none;width:10px;height:10px;border:solid var(--ink-dim);border-width:0 1.5px 1.5px 0;transform:rotate(45deg);margin-right:6px;transition:transform .15s}
.rrow.is-open .chev{transform:rotate(-135deg);margin-top:6px}
.recipe-panel{background:var(--paper);color:var(--paper-ink);font-family:var(--serif);padding:18px 18px 16px;margin:0 0 8px;border-top:3px solid var(--paper-ink);border-bottom:3px solid var(--paper-ink);position:relative}
.recipe-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--paper-ink)}
.recipe-meta{font-style:italic;color:var(--paper-dim);font-size:var(--fs-footnote);margin-bottom:8px}
.scaler{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.scaler-label{font:500 var(--fs-caption)/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--paper-dim)}
.recipe-panel .btn{border-color:var(--paper-ink);color:var(--paper-ink)} .recipe-panel .btn.ghost{border-color:var(--paper-line);color:var(--paper-dim)} .recipe-panel .btn:hover{background:rgba(31,58,50,.06)}
.recipe-panel .hint{color:var(--paper-dim);font-family:var(--body)}
.ings{margin-top:8px}
.ing{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--paper-line);font-size:var(--fs-subhead)}
.ing-name{flex:0 1 auto;font-weight:600;min-width:0} .leader{flex:1;min-width:14px} .ing-amt{flex:none;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:baseline;gap:4px}
.ing-amt.muted{color:var(--paper-dim);font-style:italic}
.ing .chip{border-color:var(--paper-line);color:var(--paper-dim);font-family:var(--body);font-size:var(--fs-caption);padding:2px 8px}
.ing-qty{width:6.5em;padding:4px 6px;border:1px solid var(--paper-line);border-radius:3px;background:#fff;color:var(--paper-ink);font-family:var(--serif);font-size:var(--fs-subhead);text-align:right;font-variant-numeric:tabular-nums}
.ing-amt .unit{color:var(--paper-dim);font-size:var(--fs-footnote)}
details.sub,details.method{margin:6px 0 4px;border:1px solid var(--paper-line);border-radius:3px;background:rgba(255,255,255,.55)}
details.sub > summary,details.method > summary{cursor:pointer;padding:9px 12px;font:500 var(--fs-caption)/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)}
details.sub .recipe-panel{border:0;padding:6px 12px 12px;background:none} details.sub .recipe-panel::before{display:none}
details.method p{padding:0 12px 12px;line-height:1.5}
.note{margin-top:10px;font-style:italic;color:var(--paper-dim);font-size:var(--fs-footnote)}
.spec-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 0 4px}
.spec-grid dt{font:500 var(--fs-caption)/1.5 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-dim)} .spec-grid dd{margin:0;line-height:1.45}
.spec .spec-h{color:var(--brass-deep);padding-top:16px}
.spec .ings{margin-top:0}
.spec .btn{margin-top:14px}

/* needs making / low-out */
.need,.lowout{border:1px solid var(--line-strong);border-radius:var(--r);padding:0 16px 14px;margin-top:6px;background:var(--bg-deep)}
.need.has-items,.lowout.has-items{border-color:var(--amber)}
.need-head{padding-top:14px;border-bottom:0;margin-bottom:0}
.scroll-x{overflow-x:auto}
.need-table{width:100%;border-collapse:collapse;font-size:var(--fs-footnote);min-width:520px}
.need-table th{text-align:left;font:500 var(--fs-caption)/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);padding:10px 8px 8px 0;border-bottom:1px solid var(--line)}
.need-table td{padding:10px 8px 10px 0;border-bottom:1px solid var(--line);vertical-align:top} .need-table td:last-child{text-align:right;padding-right:0}
.need-name{display:block}
.need > .btn{margin-top:14px}
.lvl{display:inline-block;align-self:flex-start;padding:3px 9px;border-radius:999px;font:500 var(--fs-caption)/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase}
.lvl.low,.lvlchip.low{background:rgba(224,164,58,.18);color:var(--amber);border-color:rgba(224,164,58,.5)} .lvl.out,.lvlchip.out{background:rgba(211,4,4,.2);color:#ff8a80;border-color:rgba(211,4,4,.6)}

/* prep plan */
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 6px}
.picker{border:1px solid var(--line-strong);border-radius:var(--r);padding:0 14px 10px;margin:8px 0 14px;background:var(--bg-deep)}
.bucket{border-bottom:1px solid var(--line)} .bucket > summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;min-height:var(--tap);padding:10px 0;list-style:none} .bucket > summary::-webkit-details-marker{display:none}
.pick-chip{padding:8px 13px;border:1px solid var(--line-strong);border-radius:999px;font-size:var(--fs-footnote);min-height:36px} .pick-chip.is-on{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.plan{margin-top:6px}
.phase{margin-bottom:10px}
.step{margin:12px 0 4px;padding:0 0 6px 12px;border-left:2px solid var(--line-strong)} .step.is-done{border-color:var(--brass);opacity:.75}
.step-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0 2px}
.step-name{font-family:var(--display);text-transform:uppercase;font-size:var(--fs-subhead)}
.lead{font:400 var(--fs-footnote)/1.3 var(--display);color:var(--brass);padding:2px 0 4px}
.method-line{font-family:var(--serif);font-style:italic;font-size:var(--fs-footnote);color:var(--ink-dim);padding:8px 0 2px;line-height:1.45}

/* map */
.area{margin-bottom:10px}
.unit{border-bottom:1px solid var(--line)}
.unit > summary{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:var(--tap);padding:12px 0;list-style:none} .unit > summary::-webkit-details-marker{display:none}
.unit-name{font-family:var(--display);text-transform:uppercase;font-size:var(--fs-body)}
.unit > summary::before{content:"›";font-family:var(--display);color:var(--brass);margin-right:8px;display:inline-block;transition:transform .15s} .unit[open] > summary::before{transform:rotate(90deg)}
.shelf.depth-1{margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}
.shelf.depth-2{margin-left:12px;padding-left:12px;border-left:1px solid var(--line)}

/* stock */
.stockrow{align-items:center;gap:10px}
.stockrow.is-low .row-title{color:var(--amber)} .stockrow.is-out .row-title{color:#ff8a80}
.lvlseg .seg-btn{min-height:38px;padding:0 11px;font-size:var(--fs-footnote)}
.lvlseg .seg-btn.good.is-on{background:var(--good);color:var(--bg)} .lvlseg .seg-btn.low.is-on{background:var(--amber);color:var(--bg)} .lvlseg .seg-btn.out.is-on{background:var(--red);color:#fff}
.lowout .chipwall{padding-top:10px}

/* needs making: below ~600px the 5-column table cannot fit, so each row stacks
   (item + level, then where + when, then the action) rather than scrolling off-screen */
@media (max-width:600px){
  .need-table{min-width:0}
  .need-table thead{display:none}
  .need-table tbody,.need-table tr,.need-table td{display:block}
  .need-table tr{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
  .need-table tr:last-child{border-bottom:0}
  .need-table td{border:0;padding:0}
  .need-table td:nth-child(1){grid-area:1/1}
  .need-table td:nth-child(2){grid-area:1/2;text-align:right}
  .need-table td:nth-child(3){grid-area:2/1;color:var(--ink-dim);font-size:var(--fs-footnote);padding-top:3px}
  .need-table td:nth-child(4){grid-area:2/2;text-align:right;color:var(--ink-faint);font-size:var(--fs-caption);padding-top:3px}
  .need-table td:nth-child(5){grid-area:3/1/auto/span 2;text-align:left;padding-top:10px}
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

anything-still-to-strain","t":"Finish anything still to strain"},{"k":"wk-sun--check-label-and-put-away-the-dehydrated-fruit","t":"Check, label and put away the dehydrated fruit","d":"everything finished this week"}],[],[{"k":"wk-tue--lychee-martini-batch","t":"Lychee martini batch"},{"k":"wk-tue--dehydrated-lemons","t":"Dehydrated lemons"}],[{"k":"wk-wed--strain-the-lychee-martini","t":"Strain the lychee martini","d":"the batch started Tuesday"},{"k":"wk-wed--dehydrated-limes","t":"Dehydrated limes"}],[{"k":"wk-thu--top-up-demerara","t":"Top up Demerara","d":"check the level first"},{"k":"wk-thu--top-up-simple","t":"Top up Simple","d":"check the level first"},{"k":"wk-thu--top-up-lemongrass","t":"Top up Lemongrass","d":"check the level first"},{"k":"wk-thu--top-up-pandan","t":"Top up Pandan","d":"check the level first"},{"k":"wk-thu--top-up-black-sesame","t":"Top up Black Sesame","d":"check the level first"},{"k":"wk-thu--top-up-chrysanthemum-honey","t":"Top up Chrysanthemum Honey","d":"check the level first"},{"k":"wk-thu--top-up-tamarind-agave","t":"Top up Tamarind Agave","d":"check the level first"},{"k":"wk-thu--top-up-red-bean-orgeat","t":"Top up Red Bean Orgeat","d":"check the level first"},{"k":"wk-thu--top-up-vanilla","t":"Top up Vanilla","d":"check the level first"},{"k":"wk-thu--top-up-star-anise-vanilla","t":"Top up Star Anise Vanilla","d":"check the level first"}],[{"k":"wk-fri--juniper-tea-batch","t":"Juniper tea batch","d":"if low"},{"k":"wk-fri--ube-batch","t":"Ube batch","d":"if low"},{"k":"wk-fri--infuse-any-low-spirits","t":"Infuse any low spirits"}],[{"k":"wk-sat--strain-anything-started-friday","t":"Strain anything started Friday"},{"k":"wk-sat--more-dehydrated-lemons-and-limes","t":"More dehydrated lemons and limes"}]],"restock":[{"name":"Pure Alcohols","items":[{"k":"restock--roku-gin","t":"Roku Gin"},{"k":"restock--mijenta-blanco-tequila","t":"Mijenta Blanco Tequila"},{"k":"restock--ming-river-baijiu","t":"Ming River Baijiu"},{"k":"restock--h <script>
/* Juniper & Co barback board — app logic. Data lives in window.JC (embedded). */
(function () {
  "use strict";
  const JC = window.JC;
  const OZ = 29.5735;
  const FILL_MAX = 99;

  // ---------- tiny DOM helpers ----------
  const $ = (s, r) => (r || document).querySelector(s);
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (k === "dataset") Object.assign(n.dataset, v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  }
  const fmtNum = (x) => (Math.round(x * 10) / 10).toLocaleString("en-US", { maximumFractionDigits: 1 });
  const pad = (n) => String(n).padStart(2, "0");

  // ---------- bar-day: 05:00 local to 04:59 next day ----------
  function barDate(d) {
    d = d ? new Date(d) : new Date();
    d = new Date(d.getTime() - 5 * 3600 * 1000);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function prettyDay(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  }
  function timeAgo(iso) {
    if (!iso) return "";
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " hr ago";
    return Math.floor(s / 86400) + " d ago";
  }

  // ---------- state ----------
  const state = {
    tab: "open",
    today: barDate(),
    day: barDate(),           // day being viewed on Open / Close
    run: { open: {}, fill: {}, close: {}, wk: {}, by: {} },
    stock: {},                // key -> {s, at}
    prep: { sel: [], checks: {} },
    days: [],                 // recent run docs [{id, open, fill, close}]
    db: null,
    dbStatus: "local",        // local | live | offline
    unsub: {},
    openRecipe: null,
    factor: {},               // recipe id -> scale factor
    oz: false,
    stockFilter: "", stockOnlyLow: false,
    mapFilter: "",
    cocktailFilter: "", recipeFilter: "", recipeKind: "batch",
    prepView: "recipes",      // recipes | plan
    picker: false, pickerSel: new Set(),
    fillOpen: false,
    shifts: {}, shiftWeek: null, // date -> [start, end] for the week bar
    who: "BQ",                // personal Hub copy: no initials gate, every write is his
  };
  const isToday = () => state.day === state.today;

  // ---------- persistence: shared db with a local fallback ----------
  const LS = {
    get(k) { try { return JSON.parse(localStorage.getItem("jc:" + k) || "null"); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("jc:" + k, JSON.stringify(v)); } catch (e) { } },
  };
  function stampSync() {
    const n = $("#syncDot");
    if (!n) return;
    n.className = "sync " + state.dbStatus;
    n.title = state.dbStatus === "live" ? "Shared live with everyone on this page" : state.dbStatus === "offline" ? "Shared board unreachable, saving on this device only" : "Saving on this device only";
    n.textContent = state.dbStatus === "live" ? "shared" : state.dbStatus === "offline" ? "offline" : "this device";
  }
  async function write(path, patch) {
    // patch is a nested object; nested objects merge, scalars replace.
    if (!state.db) { LS.set(path, deepMerge(LS.get(path) || {}, patch)); return; }
    const ref = state.db.doc(path);
    try { await ref.update(patch); }
    catch (e) {
      if (e && e.code === "invalid_argument") { try { await ref.set(patch); } catch (e2) { console.warn(e2); } }
      else if (e && (e.code === "unavailable")) { setTimeout(() => ref.update(patch).catch(() => { }), 500 + Math.random() * 800); }
      else console.warn(e);
    }
  }
  // Snapshot data() is frozen and shared across deliveries; copy anything we mutate in place.
  const thaw = (o) => Object.assign({}, o && typeof o === "object" ? o : null);
  function deepMerge(a, b) { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) a[k] = deepMerge(a[k] && typeof a[k] === "object" ? a[k] : {}, b[k]); else a[k] = b[k]; } return a; }

  // Every action, one row, nothing derived: who, when, what, and the value written. The tabs
  // read the current-state docs; this collection is the tape behind them, for Claude to read back.
  // ponytail: append-only and unbounded — trim by date from the vault side if it ever gets heavy
  function logEvent(kind, key, value) {
    const row = { at: new Date().toISOString(), by: state.who || "??", day: state.today, kind: kind, key: key, value: value === undefined ? null : value };
    if (!state.db) { const log = LS.get("events") || []; log.push(row); LS.set("events", log.slice(-300)); return; }
    state.db.collection("events").add(row).catch((e) => console.warn(e));
  }

  function subscribeDay(day) {
    if (state.unsub.run) state.unsub.run();
    if (state.unsub.prep) state.unsub.prep();
    state.run = { open: {}, fill: {}, close: {}, wk: {}, by: {} };
    state.prep = { sel: [], checks: {}, by: {} };
    if (!state.db) {
      const r = LS.get("runs/" + day) || {}; state.run = { open: thaw(r.open), fill: thaw(r.fill), close: thaw(r.close), wk: thaw(r.wk), by: thaw(r.by) };
      const p = LS.get("prep/" + day) || {}; state.prep = { sel: Array.isArray(p.sel) ? p.sel.slice() : [], checks: thaw(p.checks), by: thaw(p.by) };
      render(); return;
    }
    state.unsub.run = state.db.doc("runs/" + day).onSnapshot((snap) => {
      const r = snap.exists ? snap.data() : {};
      state.run = { open: thaw(r.open), fill: thaw(r.fill), close: thaw(r.close), wk: thaw(r.wk), by: thaw(r.by) };
      render();
    }, (e) => { console.warn(e); state.dbStatus = "offline"; stampSync(); });
    state.unsub.prep = state.db.doc("prep/" + day).onSnapshot((snap) => {
      const p = snap.exists ? snap.data() : {};
      state.prep = { sel: Array.isArray(p.sel) ? p.sel.slice() : [], checks: thaw(p.checks), by: thaw(p.by) };
      render();
    }, (e) => console.warn(e));
  }
  function subscribeShared() {
    if (!state.db) { state.stock = thaw((LS.get("stock/current") || {}).items); return; }
    state.db.doc("stock/current").onSnapshot((snap) => {
      state.stock = thaw(snap.exists && snap.data().items); render();
    }, (e) => console.warn(e));
    state.db.collection("runs").orderBy("day", "desc").limit(14).onSnapshot((qs) => {
      state.days = qs.docs.map((d) => ({ id: d.id, ...d.data() })); render();
    }, (e) => console.warn(e));
  }
  async function connect() {
    stampSync();
    if (!window.claude || typeof window.claude.use !== "function") { subscribeShared(); subscribeDay(state.day); return; }
    let db = null;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (db) { state.db = db; state.dbStatus = "live"; }
    stampSync();
    subscribeShared();
    subscribeDay(state.day);
  }

  // ---------- run mutations ----------
  function setRunItem(kind, key, value) {
    if (!isToday()) return;
    state.run[kind][key] = value;
    const patch = {}; patch[kind] = {}; patch[kind][key] = value; patch.day = state.day; patch.at = new Date().toISOString();
    // the fill is a running count, not a thing one person owns; the checklists are
    if (kind !== "fill") { const bk = kind + ":" + key; state.run.by[bk] = state.who; patch.by = {}; patch.by[bk] = state.who; }
    write("runs/" + state.day, patch);
    logEvent(kind, key, value);
    render();
  }
  function clearFill() {
    if (!isToday()) return;
    const patch = { fill: {}, day: state.day, at: new Date().toISOString() };
    for (const s of JC.fill) for (const { k } of s.items) if (k in state.run.fill) { patch.fill[k] = 0; state.run.fill[k] = 0; }
    write("runs/" + state.day, patch); logEvent("fill", "*cleared*", 0); render();
  }
  function setStock(key, s) {
    const cur = state.stock[key] || {};
    const next = cur.s === s ? null : s;  // tapping the active state clears it
    state.stock[key] = { s: next, at: new Date().toISOString(), day: state.today, by: state.who };
    const patch = { items: {} }; patch.items[key] = state.stock[key];
    write("stock/current", patch); logEvent("stock", key, next); render();
  }
  function setPrep(patch) {
    Object.assign(state.prep, patch);
    const p = {}; if (patch.sel) p.sel = patch.sel; if (patch.checks) p.checks = patch.checks; p.day = state.day;
    write("prep/" + state.day, p); if (patch.sel) logEvent("prep-plan", "selection", patch.sel); render();
  }
  function togglePrepCheck(k) {
    const checks = Object.assign({}, state.prep.checks); checks[k] = checks[k] ? 0 : 1;
    state.prep.checks = checks; state.prep.by[k] = state.who;
    const p = { checks: {}, by: {} }; p.checks[k] = checks[k]; p.by[k] = state.who; p.day = state.day;
    write("prep/" + state.day, p); logEvent("prep", k, checks[k]); render();
  }

  // ---------- recipes index ----------
  const R = {}; JC.recipes.forEach((r) => (R[r.id] = r));
  const byKind = (k) => JC.recipes.filter((r) => r.kind === k);
  // ponytail: cocktail specs live on their own tab only; a spec id must never be planned or made
  const makeable = (id) => !!R[id] && R[id].kind !== "cocktail";
  const tierName = ["Fresh", "Pantry", "Alcohol", "Refrigerated"];
  const tierOf = (name) => { const t = JC.tiers[name.toLowerCase()]; return t == null ? 1 : t; };

  // ---------- prep-day engine (raw -> build-up -> assemble) ----------
  function plan(selIds) {
    const raws = new Map();   // name -> {name, g, extra:{unit: qty}, tier}
    const subs = new Map();   // rid -> depth
    const seen = new Set();
    function addRaw(ing, mult) {
      const key = ing.n.toLowerCase();
      let row = raws.get(key); if (!row) { row = { name: ing.n, g: 0, extra: {}, tier: tierOf(ing.n) }; raws.set(key, row); }
      if (ing.q == null) return;
      if (ing.u === "g") row.g += ing.q * mult;
      else row.extra[ing.u] = (row.extra[ing.u] || 0) + ing.q * mult;
    }
    function walk(rid, depth, mult) {
      const r = R[rid]; if (!r) return;
      for (const ing of r.ings) {
        if (ing.p && R[ing.p]) {
          const d = Math.max(subs.get(ing.p) || 0, depth + 1);
          subs.set(ing.p, d);
          if (!seen.has(ing.p)) { seen.add(ing.p); walk(ing.p, d, 1); } // preps are made as whole card batches
        } else addRaw(ing, mult);
      }
    }
    selIds.filter(makeable).forEach((id) => walk(id, 0, 1));
    const raw = [...raws.values()].sort((a, b) => a.tier - b.tier || a.name.localeCompare(b.name));
    const build = [...subs.entries()].map(([rid, depth]) => ({ rid, depth, lead: R[rid].lead || 0 }))
      .filter((b) => !selIds.includes(b.rid))
      .sort((a, b) => b.depth - a.depth || b.lead - a.lead || R[a.rid].name.localeCompare(R[b.rid].name));
    const memo = {};
    function cp(rid, stack) {
      if (memo[rid] != null) return memo[rid];
      if (stack.has(rid)) return 0;
      stack.add(rid);
      let best = 0;
      for (const ing of R[rid].ings) if (ing.p && R[ing.p]) best = Math.max(best, (R[ing.p].lead || 0) + cp(ing.p, stack));
      stack.delete(rid); memo[rid] = best; return best;
    }
    const assemble = selIds.filter(makeable).map((id) => ({ rid: id, eta: cp(id, new Set()) }));
    return { raw, build, assemble };
  }
  function humanEta(min) {
    if (!min) return ""; if (min < 60) return "~" + min + " min"; if (min < 1440) return "~" + Math.round(min / 60) + " hr";
    if (min < 10080) { const d = Math.round(min / 1440); return "~" + d + " day" + (d > 1 ? "s" : ""); }
    const w = Math.round(min / 10080); return "~" + w + " week" + (w > 1 ? "s" : "");
  }

  // ---------- who is on shift ----------
  // Nobody gets past this without initials. The ghost ice log used to ask per action; now it is
  const byOf = (kind, key) => (state.run.by && state.run.by[kind + ":" + key]) || "";
  const prepBy = (k) => (state.prep.by && state.prep.by[k]) || "";
  // ---------- rendering ----------
  const TABS = [
    ["open", "Open"], ["close", "Close"], ["prep", "Batch prep"], ["cocktails", "Cocktails"], ["map", "Map"], ["stock", "Stock"],
  ];
  function needsMaking() {
    return JC.stock.filter((it) => it.r && makeable(it.r) && state.stock[it.k] && (state.stock[it.k].s === "low" || state.stock[it.k].s === "out"))
      .map((it) => ({ ...it, st: state.stock[it.k] }))
      .sort((a, b) => (a.st.s === "out" ? 0 : 1) - (b.st.s === "out" ? 0 : 1) || a.t.localeCompare(b.t));
  }
  function lowOut() {
    return JC.stock.filter((it) => state.stock[it.k] && (state.stock[it.k].s === "low" || state.stock[it.k].s === "out"))
      .map((it) => ({ ...it, st: state.stock[it.k] }));
  }

  function renderTabs() {
    const bar = $("#tabs"); bar.replaceChildren();
    const nm = needsMaking().length + carryOver().length, lo = lowOut().length;
    for (const [id, label] of TABS) {
      const badge = id === "prep" && nm ? el("span", { class: "badge", text: nm }) : id === "stock" && lo ? el("span", { class: "badge", text: lo }) : null;
      bar.append(el("button", { class: "tab" + (state.tab === id ? " is-on" : ""), role: "tab", "aria-selected": state.tab === id ? "true" : "false", onclick: () => { state.tab = id; render(); window.scrollTo(0, 0); } }, label, badge));
    }
  }

  // scheduled J&Co shifts (calendar sync -> earnings.db), fetched once per week shown
  function loadShifts(from, to) {
    state.shiftWeek = from;
    fetch("/jc/api/shifts?from=" + from + "&to=" + to).then((r) => (r.ok ? r.json() : {})).then((j) => { state.shifts = j || {}; render(); }).catch(() => { });
  }
  function dayStrip() {
    const wrap = el("div", { class: "daystrip" });
    const label = isToday() ? "Tonight · " + prettyDay(state.day) : prettyDay(state.day) + " · read only";
    wrap.append(el("span", { class: "daylabel", text: label }));
    // ponytail: Mon-Sun of the week holding today; earlier weeks' run days are not reachable
    const dow = (() => { const [y, m, d] = state.today.split("-").map(Number); return (new Date(y, m - 1, d).getDay() + 6) % 7; })();
    const mon = isoShift(state.today, -dow), sun = isoShift(mon, 6);
    if (state.shiftWeek !== mon) loadShifts(mon, sun);
    // hour grid: each day a column running 2pm (top) to 4am (bottom), shifts as brass blocks
    const W0 = 14, SPAN = 14, hr = (s) => { let [h, m] = s.split(":").map(Number); if (h < 12) h += 24; return h + m / 60; };
    const ampm = (s) => { const [h, m] = s.split(":").map(Number); return ((h % 12) || 12) + (m ? ":" + pad(m) : "") + (h >= 12 ? "p" : "a"); };
    const week = el("div", { class: "weekbar", role: "group", "aria-label": "Bar day" });
    const days = [...Array(7)].map((_, i) => isoShift(mon, i));
