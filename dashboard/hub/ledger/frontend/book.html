<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/assets/favicon.png">
<script>
  /* no-flash theme init — same contract as every other hub page. */
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub.theme");
      if (t === "glass") t = "liquid";
      r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
      if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
      var s = localStorage.getItem("hub.surface");
      if (s !== "light" && s !== "dark") {
        s = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      r.setAttribute("data-surface", s);
    } catch (e) { r.setAttribute("data-theme", "liquid"); r.setAttribute("data-surface", "dark"); }
  })();
</script>
<title>HUB · ledger</title>
<!-- webfonts: one same-origin, render-blocking stylesheet carrying BOTH themes'
     faces. Replaces the Google Fonts <link> this head used to inject from JS:
     cross-origin, a second hop for each woff2, discovered too late to block
     first paint, and `display=swap` — so the page painted in the fallback stack
     and reflowed when the real faces landed. That reflow was the load flash.
     Declaring the inactive theme's faces costs nothing (a @font-face downloads
     only when a rule uses the family) and makes a live theme switch fetch-free,
     which is why window.HUB_FONTS is gone — theme-switch.js no-ops without it.
     See static/vendor/fonts/fonts.css; regenerate with tools/vendor-fonts.py. -->
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
<script>
  /* Preload the ACTIVE theme's two latin faces. Without this they are not
     discovered until fonts.css has parsed AND layout has reached text that uses
     them — late enough on a slow link to paint a frame in the fallback stack and
     reflow, which is the flash. Two files, ~40 KB. data-theme is already set by
     the no-flash snippet above, which is why this sits after it. */
  (function () {
    var FACES = {
      cobalt: ["/static/vendor/fonts/archivo-black-normal-latin.woff2",
               "/static/vendor/fonts/space-grotesk-normal-latin.woff2"]
    };
    (FACES[document.documentElement.getAttribute("data-theme")] || []).forEach(function (href) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
      l.href = href;
      document.head.appendChild(l);
    });
  })();
</script>
<!-- order per DESIGN.md: chrome -> base -> themes -> module. -->
<link rel="stylesheet" href="/static/css/chrome.css?v=12">
<link rel="stylesheet" href="/static/css/base.css?v=6">

<style>
  /* The book. A mark, not a portfolio brag.

     The header carries three numbers and never one, because a single figure
     would be a lie the page cannot caveat: the same inventory prices $810 to
     $1,400 across defensible statistics, so which basis produced a number is
     part of the number. Each of the three sits over the sentence saying what it
     is made of. */
  /* Every hub module paints the ground itself — chrome.css and base.css carry the
     topbar and the components, not the page body. Without this the tokens resolve
     to a dark palette over a white default ground and the whole table goes
     invisible, which is exactly what the first render did. */
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body);
    font-feature-settings: var(--feat-text);
    font-size: var(--fs-subhead); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 20px 90px; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s-6); }
  /* the item table's floor is ~690px: past that it scrolls in its own box, not the page (641-759 ran the page sideways) */
  .tbl-scroll { overflow-x: auto; }

  .marks { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: var(--s-5); }
  .mark { border: 1px solid var(--line); background: var(--bg-elev); padding: var(--s-4) var(--s-5) var(--s-5); }
  .mark h3 { margin: 0 0 var(--s-2); font-size: var(--fs-caption); letter-spacing: 0.09em; text-transform: uppercase;
             color: var(--violet-label); font-weight: 600; }
  .mark .big { font-size: var(--fs-large-title); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .mark .range { font-size: var(--fs-title); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .mark .sub { margin-top: var(--s-2); font-size: var(--fs-footnote); color: var(--fg-dim); line-height: 1.5; }
  .mark .sub em { font-style: normal; color: var(--fg-mute); }

  /* The verdict is the point of the change card, so it is the loud part.
     "not distinguishable from marking noise" is the DEFAULT answer, and the page
     has to be willing to print it plainly rather than in a footnote. */
  .verdict { margin-top: var(--s-1); font-size: var(--fs-subhead); font-weight: 600; line-height: 1.35; }
  .verdict.noise { color: var(--fg-dim); }
  .verdict.real { color: var(--fg); }

  table { width: 100%; border-collapse: collapse; font-size: var(--fs-footnote); }
  th { text-align: left; font-size: var(--fs-caption); letter-spacing: 0.08em; text-transform: uppercase;
       color: var(--fg-dim); font-weight: 600; padding: 0 var(--s-3) var(--s-2); border-bottom: 1px solid var(--line); }
  td { padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--line-soft); vertical-align: baseline; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .name { color: var(--fg); }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; }
  tr.dim td { color: var(--fg-faint); }

  /* Row five closes the concentration block. The top five are over half the
     book; the rule says so without a paragraph. */
  tr.top-cut td { border-bottom: 2px solid var(--line-strong); }

  /* The chip is computed, not decorative, and is never suppressed for
     compactness: a $252.34 row reading `thin` on a depth of 16 is telling the
     truth about a knife, and the same row without it is not. */
  .chip { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; height: var(--ctl-h, 28px); padding: 0 10px; line-height: 1; white-space: nowrap; border: 0; border-radius: var(--r-card); font-size: var(--fs-caption); letter-spacing: 0.05em;
          text-transform: uppercase; font-weight: 600;
          background: color-mix(in oklab, var(--fg-dim) 22%, transparent); color: var(--fg-dim); }
  .chip.solid { background: var(--good); color: var(--bg); }
  .chip.thin  { background: var(--warn); color: var(--bg); }
  .chip.stale { background: color-mix(in oklab, var(--fg-dim) 22%, transparent); color: var(--fg-dim); }
  .chip.na    { background: color-mix(in oklab, var(--fg-faint) 14%, transparent); color: var(--fg-faint); }

  .up { color: var(--good); } .down { color: var(--alert); }
  .foot { font-size: var(--fs-footnote); color: var(--fg-dim); line-height: 1.7; max-width: 84ch; }
  .foot .chip { margin: 0 2px; }
</style>
</head>
<body>

<div class="shell">

    <header class="topbar">
    <!-- the bar itself (back, brand, toggle, theme, sign-out, modules) is drawn by
         topbar.jsx; only this page's extras live here, placed by data-slot -->
    <span data-slot="crumb" class="crumb" id="crumb">ledger</span>
  </header>

  <main class="wrap"></main>
</div>
<script type="application/json" id="ledger-data">{{ {"b": b, "change": change, "windows": windows, "top5_share": (b.concentration.top5_share|string) if b.rows else ""}|tojson }}</script>
<script defer src="/jsx/ledger/frontend/static/book.jsx"></script>
  <script>
  /* load fallback: the body is drawn by the deferred JSX above; if nothing marked itself mounted, say so */
  window.addEventListener("load", function () {
    setTimeout(function () {
      if (document.querySelector("[data-react-mounted]")) return;
      var m = document.querySelector("main.wrap");
      if (m) m.textContent = "The page failed to load. Reload to try again.";
    }, 4000);
  });
  </script>
</body>
