<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/assets/favicon.png">
<!-- no-flash: set theme + surface before first paint (mirrors every hub page) -->
<script>
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub.theme");
      if (t === "glass") t = "liquid";
      r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
      if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
      var s = localStorage.getItem("hub.surface");
      if (s !== "light" && s !== "dark") {
        var old = localStorage.getItem("hub:surface");
        s = (old === "light" || old === "dark") ? old : "dark";
      }
      r.setAttribute("data-surface", s);
    } catch (e) { r.setAttribute("data-theme","liquid"); r.setAttribute("data-surface","dark"); }
  })();
</script>
<title>HUB · artifacts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts: only the ACTIVE theme's families download. data-theme is already set by
     the no-flash snippet above; theme-switch.js loads the other set on a live switch. -->
<script>
  window.HUB_FONTS = {
    cobalt: "https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  };
  (function () {
    var href = window.HUB_FONTS[document.documentElement.getAttribute("data-theme")];
    if (!href) return;
    var l = document.createElement("link");
    l.rel = "stylesheet"; l.href = href; l.setAttribute("data-hub-font", "1");
    document.head.appendChild(l);
  })();
</script>

<!-- order per DESIGN.md: chrome -> base -> themes -> module. The page used to
     hand-roll its own .topbar instead of linking chrome.css, which is the one
     thing PRODUCT.md principle 3 says a module never does. -->
<link rel="stylesheet" href="/static/css/chrome.css?v=9">
<link rel="stylesheet" href="/static/css/base.css?v=4">
<link rel="stylesheet" href="/static/css/components.css?v=5">
<link rel="stylesheet" href="/static/css/themes/cobalt.css?v=2">
<link rel="stylesheet" href="/static/css/themes/liquid.css?v=2">
<script defer src="/hub-modules.js"></script><script defer src="/static/js/theme-switch.js?v=34"></script><script defer src="/static/vendor/react.production.min.js"></script><script defer src="/static/vendor/react-dom.production.min.js"></script><script defer src="/jsx/static/js/topbar.jsx"></script><script defer src="/jsx/artifacts/frontend/static/artifacts.jsx?v=3"></script>

<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:var(--font-body); font-size:var(--fs-subhead); line-height:1.5;
  }

  .shell {
    height:100dvh; display:grid; grid-template-rows:auto 1fr; overflow:hidden;
  }
  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ---------------- two panes ----------------
     Rail is nav + filter, index is the catalog. 216px clears the longest
     subject label ("Vault & Design" + a count chip) without wrapping. */
  .body {
    display:grid; grid-template-columns:216px minmax(0, 1fr);
    min-height:0; overflow:hidden;
  }

  /* ---------------- subject rail ---------------- */
  .rail {
    border-right:1px solid var(--line);
    padding:var(--s-4) var(--s-3);
    overflow-y:auto; min-height:0;
    display:flex; flex-direction:column; gap:2px;
  }
  .rail-sep {
    height:1px; background:var(--line-soft);
    margin:var(--s-3) var(--s-2);
  }
  .tab {
    display:flex; align-items:center; gap:var(--s-2);
    width:100%; text-align:left; cursor:pointer;
    font-family:var(--font-body); font-size:var(--fs-footnote); line-height:1.3;
    color:var(--fg-dim); background:none;
    border:1px solid transparent; border-radius:var(--r-card);
    padding:7px var(--s-3);
    transition:color 160ms ease-out, background 160ms ease-out, border-color 160ms ease-out;
  }
  .tab:hover { color:var(--fg); background:var(--bg-elev); }
  .tab-name { flex:1 1 auto; min-width:0; }
  .tab-count {
    flex:0 0 auto; font-size:var(--fs-caption); color:var(--fg-faint);
    font-variant-numeric:tabular-nums; font-feature-settings:var(--feat-tnum);
  }
  .tab[aria-selected="true"] {
    color:var(--fg); background:var(--accent-faint);
    border-color:var(--accent-dim); font-weight:500;
  }
  .tab[aria-selected="true"] .tab-count { color:var(--fg-dim); }

  /* ---------------- index pane ---------------- */
  .index { overflow-y:auto; min-height:0; padding:var(--s-4) var(--s-5) var(--s-7); }
  /* Capped measure, not full-bleed: the row is `title ... date`, so an uncapped
     pane strands the date a thousand pixels from the thing it dates. 880px puts
     the meta column just past where the longest description wraps. */
  .index-list { display:flex; flex-direction:column; max-width:880px; }

  .group {
    position:sticky; top:0; z-index:1;
    background:var(--bg);
    font-family:var(--font); font-feature-settings:var(--feat-display);
    font-size:var(--fs-body); font-weight:600; color:var(--violet-label);
    letter-spacing:.01em;
    padding:var(--s-6) 0 var(--s-2);
    margin:0;
    border-bottom:1px solid var(--line-soft);
  }
  .group:first-child { padding-top:0; }
  .group .n {
    color:var(--fg-faint); font-weight:400; margin-left:var(--s-2);
    font-variant-numeric:tabular-nums; font-feature-settings:var(--feat-tnum);
  }

  /* A row, not a card. 15 near-identical cards in an auto-fill grid left
     three-quarters of every one-item row empty and pushed the catalog past
     2000px; the same 15 as rows read in one screen at half-snap. */
  /* Three columns: glyph | text | meta. The glyph is its own column rather than
     the first inline item, so the description lines up under the title instead
     of hanging left of it, a two-glyph favicon has room to be two glyphs, and a
     row with no favicon at all collapses the column to zero and still aligns. */
  .row {
    display:grid; grid-template-columns:auto minmax(0, 1fr) auto;
    align-items:baseline; column-gap:var(--s-2);
    padding:10px var(--s-3); margin:0 calc(-1 * var(--s-3));
    text-decoration:none; color:inherit;
    border-bottom:1px solid var(--line-soft);
    border-radius:var(--r);
    transition:background 160ms ease-out;
  }
  .row:hover { background:var(--bg-elev); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

  .row-head {
    grid-column:2; grid-row:1;
    display:flex; align-items:baseline; gap:var(--s-2); min-width:0;
  }
  .row-fav { grid-column:1; grid-row:1; min-width:1.15em; font-size:var(--fs-subhead); line-height:1; }
  /* icon: every icon sits in one rounded tile of one size, centred on the
     title's first line (margin-top = (line box - tile) / 2, line box 1.35em).
     Topic icons are white glyphs on a colour picked per icon (RowIcon --tile);
     brand marks keep their own colours on a white tile. */
  .row-icon {
    grid-column:1; grid-row:1; align-self:start; box-sizing:border-box;
    width:28px; height:28px; margin-top:calc((1.35 * var(--fs-subhead) - 28px) / 2);
    border-radius:8px; padding:5px; object-fit:contain; background:#fff;
    box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);
  }
  .row-icon.mono { padding:0; background:var(--tile); box-shadow:none; position:relative; }
  .row-icon.mono::after {
    content:""; position:absolute; inset:6px; background:#fff;
    -webkit-mask:var(--ic) center/contain no-repeat; mask:var(--ic) center/contain no-repeat;
  }
  .row-icon + .row-head { align-self:start; }
  .row-title {
    font-family:var(--font); font-feature-settings:var(--feat-display);
    font-weight:600; font-size:var(--fs-subhead); color:var(--fg); line-height:1.35;
  }
  .row:hover .row-title { color:var(--accent); }
  /* live = self-hosted on the Hub and still moving; everything else is a page
     frozen the day it was published. Derived from a relative url, so it can
     never drift out of sync with the data. */
  .row-live {
    flex:0 0 auto; --dot-color:var(--good);
    font-size:var(--fs-caption); letter-spacing:.06em; text-transform:uppercase;
    color:var(--good); white-space:nowrap;
  }
  .row-desc {
    grid-column:2; grid-row:2; max-width:72ch; margin-top:3px;
    font-size:var(--fs-footnote); line-height:1.5; color:var(--fg-mute);
    text-wrap:pretty;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .row-meta {
    grid-row:1; grid-column:3; display:flex; align-items:baseline; gap:var(--s-3);
    margin-left:var(--s-4); white-space:nowrap;
  }
  .row-subject { font-size:var(--fs-caption); color:var(--violet-label); }
  .row-date {
    font-size:var(--fs-caption); color:var(--fg-dim); letter-spacing:.02em;
    font-variant-numeric:tabular-nums; font-feature-settings:var(--feat-tnum);
  }

  .empty { padding:var(--s-7) 0; color:var(--fg-dim); font-size:var(--fs-footnote); }

  /* filter change: the list is replaced wholesale, so a short fade is the only
     thing that keeps the swap from reading as a flicker. */
  @keyframes list-in { from { opacity:0; } to { opacity:1; } }
  .index-list { animation:list-in 160ms ease-out; }

  /* ---------------- cobalt brand pass ----------------
     Page-owned override; the frozen theme file is untouched. */
  [data-theme="cobalt"] .tab[aria-selected="true"] {
    border-width:2px; border-color:var(--accent); padding:6px 10px;
  }
  [data-theme="cobalt"] .group { color:var(--violet-label); }
  [data-theme="cobalt"] .row { border-bottom-color:var(--line); }

  /* ---------------- liquid pass ----------------
     Workbench pick "Glass rail, tiles in a grid" (artifacts-liquid-look,
     2026-10-17). The rail is the nav rail's thick glass slab (liquid.css set 14,
     same recipe); each artifact is a solid tile under a set 4 section title, so
     the wallpaper shows between tiles. Phone keeps the stacked layout below,
     with the rail as set 8 capsule chips. */
  [data-theme="liquid"] .body { grid-template-columns:246px minmax(0,1fr); }
  [data-theme="liquid"] .rail {
    align-self:start; max-height:calc(100% - 20px);
    margin:10px 0 10px 10px; padding:10px 8px; gap:2px; border:0; border-radius:26px;
    background:var(--lg-thick-fill);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    backdrop-filter:blur(var(--lg-thick-blur)) saturate(var(--lg-thick-sat));
    box-shadow:var(--lg-thick-rim), inset -1px -1px 0 rgba(0,0,0,var(--lg-rim-in-a)), var(--lq-slab-shade);
  }
  [data-theme="liquid"] .tab { padding:9px 12px; border:0; border-radius:18px; font:500 var(--fs-subhead)/1.25 var(--font); color:var(--fg); }
  [data-theme="liquid"] .tab:hover { background:var(--lg-vib); color:var(--fg); }
  [data-theme="liquid"] .tab[aria-selected="true"] { border:0; padding:9px 12px; background:var(--lg-row-on); font-weight:600; }
  [data-theme="liquid"] .tab-count { font-size:var(--fs-footnote); color:var(--fg-dim); }
  [data-theme="liquid"] .tab[aria-selected="true"] .tab-count { color:var(--fg-mute); }
  [data-theme="liquid"] .rail-sep { margin:6px 12px; background:var(--line); }

  [data-theme="liquid"] .index { padding:10px 20px 32px 14px; }
  [data-theme="liquid"] .index-list {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:10px; max-width:none;
  }
  [data-theme="liquid"] .group {
    grid-column:1 / -1; position:static; margin:18px 0 0; padding:0 6px;
    border:0; background:none; box-shadow:none;
    font:700 var(--fs-title)/1.2 var(--font-display); letter-spacing:-.01em; color:var(--fg);
  }
  [data-theme="liquid"] .group:first-child { margin-top:4px; padding-top:0; }
  [data-theme="liquid"] .group .n { font-size:var(--fs-subhead); font-weight:400; color:var(--fg-dim); }
  [data-theme="liquid"] .row {
    grid-template-columns:auto minmax(0,1fr); align-content:start;
    margin:0; padding:14px 16px; border:0; border-radius:20px; background:var(--lq-card); box-shadow:var(--lq-slab-shade);   /* liquid.css section 16 card rule */
  }
  [data-theme="liquid"] .row:hover { background:var(--lq-card-hi); }
  [data-theme="liquid"] .row:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
  [data-theme="liquid"] .row-title { font:600 var(--fs-subhead)/1.3 var(--font); color:var(--fg); }
  [data-theme="liquid"] .row:hover .row-title { color:var(--fg); }
  [data-theme="liquid"] .row-desc { grid-column:2; grid-row:2; -webkit-line-clamp:3; font-size:var(--fs-footnote); line-height:1.4; color:var(--fg-dim); }
  [data-theme="liquid"] .row-meta { grid-column:2; grid-row:3; margin:6px 0 0; }
  [data-theme="liquid"] :is(.row-date, .row-subject) { font-size:var(--fs-footnote); letter-spacing:0; color:var(--fg-dim); }
  [data-theme="liquid"] .row-live { font:600 var(--fs-footnote)/1 var(--font); letter-spacing:0; text-transform:none; }
  @media (max-width: 860px) {
    [data-theme="liquid"] .body { grid-template-columns:1fr; }
    [data-theme="liquid"] .rail {
      max-height:none; margin:4px 12px 0; padding:0; gap:6px; border:0; border-radius:0;
      background:none; -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none;
    }
    [data-theme="liquid"] .tab { width:auto; min-height:32px; padding:6px 13px; border-radius:999px; background:var(--lq-fill); font-size:var(--fs-subhead); }
    [data-theme="liquid"] .tab[aria-selected="true"] { padding:6px 13px; background:var(--lq-raised); box-shadow:0 2px 6px rgba(0,0,0,.18); }
    [data-theme="liquid"] .index { padding:12px 12px 100px; }
  }

  /* ---------------- phone ----------------
     Rule 4 of wiki/patterns/dashboard-responsive-layout: once the panes stack,
     the DOCUMENT scrolls. A 100dvh shell with two 1fr rows would hand the rail
     and the index half a screen each and call it a layout. */
  @media (max-width: 860px) {
    html, body { height:auto; }
    .shell { height:auto; min-height:100dvh; grid-template-rows:auto auto; overflow:visible; }
    .body { grid-template-columns:1fr; overflow:visible; }
    .rail {
      flex-direction:row; flex-wrap:wrap; gap:6px;
      border-right:0; border-bottom:1px solid var(--line);
      padding:var(--s-3) var(--s-4); overflow:visible;
    }
    .rail-sep { display:none; }
    .tab {
      width:auto; border-radius:var(--r-pill);
      border-color:var(--line-soft); padding:6px var(--s-3);
      min-height:32px;
    }
    .index { overflow:visible; padding:var(--s-3) var(--s-4) var(--s-7); }
    .index-list { max-width:none; }
    .row { grid-template-columns:auto minmax(0, 1fr); }
    .row-meta { grid-row:3; grid-column:2; margin-left:0; margin-top:4px; }
    .row-desc { -webkit-line-clamp:3; }
    .group { top:0; }
  }
</style>
</head>
<body>
<div class="shell">

    <header class="topbar">
    <!-- the bar itself (back, brand, toggle, theme, sign-out, modules) is drawn by
         topbar.jsx; only this page's extras live here, placed by data-slot -->
    <span data-slot="crumb" class="crumb">artifacts</span>
    <span data-slot="crumb" class="crumb-meta" id="crumbMeta" aria-live="polite">loading</span>
  </header>

  <main class="body" id="artifacts-root"></main>

</div>

<script>
// load fallback: if the React body never mounted, say so instead of leaving a blank page
window.addEventListener("load", function () {
  setTimeout(function () {
    var m = document.querySelector('[data-react-mounted="artifacts"]');
    if (m) return;
    var host = document.getElementById("artifacts-root");
    if (host) host.innerHTML = '<div class="hub-error">page failed to load</div>';
  }, 3000);
});
</script>
</body>
</html>
