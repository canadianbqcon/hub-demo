<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/assets/favicon.png">
<script>
  /* no-flash theme init — sets data-theme/data-surface before first paint.
     Same contract as every other hub page. */
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub.theme");
      if (t === "glass") t = "liquid";
      r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
      if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
      var s = localStorage.getItem("hub.surface");
      if (s !== "light" && s !== "dark") {
        s = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      r.setAttribute("data-surface", s);
    } catch (e) { r.setAttribute("data-theme", "liquid"); r.setAttribute("data-surface", "dark"); }
  })();
</script>
<title>HUB · food</title>
<!-- webfonts: one same-origin, render-blocking stylesheet carrying BOTH themes'
     faces. Replaces the Google Fonts <link> this head used to inject from JS:
     cross-origin, a second hop for each woff2, discovered too late to block
     first paint, and `display=swap` — so the page painted in the fallback stack
     and reflowed when the real faces landed. That reflow was the load flash.
     Declaring the inactive theme's faces costs nothing (a @font-face downloads
     only when a rule uses the family) and makes a live theme switch fetch-free,
     which is why window.HUB_FONTS is gone — theme-switch.js no-ops without it.
     See static/vendor/fonts/fonts.css; regenerate with tools/vendor-fonts.py. -->
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
<script>
  /* Preload the ACTIVE theme's two latin faces. Without this they are not
     discovered until fonts.css has parsed AND layout has reached text that uses
     them — late enough on a slow link to paint a frame in the fallback stack and
     reflow, which is the flash. Two files, ~40 KB. data-theme is already set by
     the no-flash snippet above, which is why this sits after it. */
  (function () {
    var FACES = {
      cobalt: ["/static/vendor/fonts/archivo-black-normal-latin.woff2",
               "/static/vendor/fonts/space-grotesk-normal-latin.woff2"]
    };
    (FACES[document.documentElement.getAttribute("data-theme")] || []).forEach(function (href) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
      l.href = href;
      document.head.appendChild(l);
    });
  })();
</script>
{% if view == "areas" %}
<!-- maplibre: the landing globe. Leaflet cannot project a sphere, and this is the
     one page that needs to. v5 UMD is pinned deliberately — v6 ships ESM only and
     this page loads classic deferred scripts like every other hub surface.
     Vendored under /static/vendor/ 2026-08-19 (was unpkg): one less external round
     trip, and the library no longer needs the public internet even though its tiles
     still do. Degrades to the plain area list if it cannot load. -->
<link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
<script defer src="/static/vendor/maplibre/maplibre-gl.js"></script>
{% else %}
<!-- leaflet: same vendored copy trips uses. Degrades to a "map unavailable" note if
     it cannot load; the list never depends on it. -->
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<script defer src="/static/vendor/leaflet/leaflet.js"></script>
{% endif %}
<!-- order per DESIGN.md: chrome -> base -> themes -> module. chrome.css carries the
     shared topbar/launcher; theme-switch.js re-injects the topbar layout on top so
     the module CSS never redefines those selectors. -->
<link rel="stylesheet" href="/static/css/chrome.css?v=12">
<link rel="stylesheet" href="/static/css/base.css?v=6">
<link rel="stylesheet" href="/static/css/components.css?v=5">
<link rel="stylesheet" href="/static/css/themes/cobalt.css?v=2">
<link rel="stylesheet" href="/static/css/themes/liquid.css?v=10">
<link rel="stylesheet" href="/static/css/map.css?v=5">
<!-- food-view.css dresses the area renderer (static/js/food-view.js); this page and the
     trips board's food tab both load it, so the two surfaces cannot drift apart. food.css
     is only this page's shell — the globe index, the columns, the crumb. -->
<link rel="stylesheet" href="/static/css/food-view.css?v=5">
<link rel="stylesheet" href="{{ url_for('food.static', filename='food.css') }}?v=21">
<script defer src="/hub-modules.js"></script><script defer src="/static/js/theme-switch.js?v=42"></script><script defer src="/static/vendor/react.production.min.js"></script><script defer src="/static/vendor/react-dom.production.min.js"></script><script defer src="/jsx/static/js/topbar.jsx"></script>
</head>
<body class="food">

<div class="hub-shell shell">

    <header class="topbar">
    <!-- the bar itself (back, brand, toggle, theme, sign-out, modules) is drawn by
         topbar.jsx; only this page's extras live here, placed by data-slot -->
    <span data-slot="crumb" class="crumb" id="crumb">food</span>
  </header>

  <main id="food-root" data-view="{{ view }}" data-area="{{ area_slug or '' }}"></main>

</div>

<script defer src="/jsx/static/js/basemap.jsx?v=1"></script>
<script defer src="/jsx/static/js/food-view.jsx?v=1"></script>
<script defer src="/jsx/food/frontend/static/food.jsx?v=1"></script>
<script>
/* load fallback: if the React body never mounted, say so instead of leaving a blank page */
window.addEventListener("load", function () {
  setTimeout(function () {
    if (document.querySelector('[data-react-mounted="food"]')) return;
    var host = document.getElementById("food-root");
    if (host) host.innerHTML = '<div class="hub-error">page failed to load</div>';
  }, 3000);
});
</script>
</body>
</html>
