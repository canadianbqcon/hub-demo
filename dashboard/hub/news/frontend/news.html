<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/static/assets/favicon.png">
  <script>
    /* no-flash theme + surface bootstrap: must run before first paint.
       Same snippet every hub page carries; see checklists.html / trips.html. */
    (() => {
      var r = document.documentElement;
      try {
        var t = localStorage.getItem("hub.theme");
        if (t === "glass") t = "liquid";
        r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
        if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
        let s = localStorage.getItem("hub.surface");
        if (s !== "light" && s !== "dark") {
          s = (window.matchMedia?.("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        r.setAttribute("data-surface", s);
      } catch (_e) { r.setAttribute("data-theme", "liquid"); r.setAttribute("data-surface", "dark"); }
    })();
  </script>
  <title>HUB · news</title>
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
  <link rel="stylesheet" href="/static/css/base.css?v=6">
  <link rel="stylesheet" href="/static/css/components.css?v=5">
  <link rel="stylesheet" href="/static/css/origins/tabbed-3-pane.css?v=1">
  <link rel="stylesheet" href="/static/css/themes/cobalt.css?v=2">
  <link rel="stylesheet" href="/static/css/themes/liquid.css?v=10">
  <link rel="stylesheet" href="/news/static/news.css?v=5">
  <script defer src="/hub-modules.js"></script><script defer src="/static/js/theme-switch.js?v=42"></script><script defer src="/static/vendor/react.production.min.js"></script><script defer src="/static/vendor/react-dom.production.min.js"></script><script defer src="/jsx/static/js/topbar.jsx"></script>
</head>
<body class="news">
<div class="hub-shell hub-t3p shell">

  <!-- ===== TOPBAR ===== -->
    <header class="topbar">
    <!-- the bar itself (back, brand, toggle, theme, sign-out, modules) is drawn by
         topbar.jsx; only this page's extras live here, placed by data-slot -->
    <button data-slot="lead" type="button" class="nav-toggle hub-t3p-nav-toggle" id="navToggle" aria-expanded="false" aria-controls="newsNav" aria-label="sections">
      <svg class="nav-toggle-g hub-t3p-nav-toggle-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.2 H20 M4 12 H20 M4 16.8 H20"/></svg>
    </button>
    <span data-slot="crumb" class="crumb">news</span>
    <span data-slot="crumb" class="crumb-section hub-t3p-crumb-section" id="crumbSection"></span>
  </header>

  <!-- ===== BODY (tab rail | list + detail split) ===== -->
  <div class="body hub-t3p-body">

    <section class="col hub-t3p-col funnel hub-t3p-rail" id="newsCol">
      <nav class="hub-nav-rail news-nav" id="newsNav">
        <button type="button" class="hub-t3p-tab hub-nav-item active" data-tab="today">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2 V12 L15.6 14.4"/></svg>today</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="economy">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 20.4 V13.2 M12 20.4 V8.4 M19.2 20.4 V4.8"/></svg>economy</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="politics">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 20.4 H19.2 M6.6 20.4 V9.6 M17.4 20.4 V9.6 M12 9.6 V20.4 M4.2 9.6 L12 4.2 L19.8 9.6"/></svg>politics</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="world">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12 H20.4 M12 3.6 C8.4 7.2 8.4 16.8 12 20.4 C15.6 16.8 15.6 7.2 12 3.6 Z"/></svg>world</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="nyc">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 20.4 V9.6 H8.4 V20.4 M9.6 20.4 V6 H14.4 V20.4 M15.6 20.4 V12 H19.8 V20.4"/></svg>nyc</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="tech">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.8" y="4.8" width="14.4" height="14.4" rx="1.2"/><path d="M9 4.8 V2.4 M15 4.8 V2.4 M9 21.6 V19.2 M15 21.6 V19.2 M4.8 9 H2.4 M4.8 15 H2.4 M21.6 9 H19.2 M21.6 15 H19.2"/></svg>tech</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="topics">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 12 L12 3.6 H18 A2.4 2.4 0 0 1 20.4 6 V12 L12 20.4 Z"/><circle cx="8.4" cy="8.4" r="1.2"/></svg>topics</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="opinion">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 5.4 H20.4 V15 H9.6 L5.4 18.6 V15 H3.6 Z"/></svg>opinion</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="audience">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.4 12 C5.4 6.6 18.6 6.6 21.6 12 C18.6 17.4 5.4 17.4 2.4 12 Z"/><circle cx="12" cy="12" r="2.7"/></svg>audience</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="community">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.4" cy="9" r="3"/><circle cx="16.2" cy="9.6" r="2.4"/><path d="M3 19.2 C3 15.6 5.4 13.8 8.4 13.8 C11.4 13.8 13.8 15.6 13.8 19.2 M13.8 15.6 C15.6 15.6 18.6 16.8 18.6 19.2"/></svg>community</span>
        </button>
        <button type="button" class="hub-t3p-tab hub-nav-item" data-tab="sources">
          <span class="hub-t3p-tab-label hub-nav-label"><svg class="hub-t3p-tab-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.4 4.2 H15 L18.6 7.8 V19.8 H5.4 Z M15 4.2 V7.8 H18.6"/><path d="M8.4 12 H15.6 M8.4 15.6 H15.6"/></svg>sources</span>
        </button>
      </nav>
    </section>

    <section class="col hub-t3p-col hub-t3p-pane" id="pane">
      <div class="hub-pane-head news-head hub-t3p-head" id="paneHead">
        <div class="news-stale" id="staleBanner" hidden>
          <span id="staleBannerText"></span>
        </div>
      </div>
      <div class="hub-split news-split hub-t3p-split" id="focusSplit">

        <div class="hub-pane-col news-col hub-t3p-list-col" id="focusCol">
          <div class="hub-pane-list news-list hub-t3p-list" id="cardList"></div>
        </div>

        <div class="side-pane hub-t3p-side" id="sidePane">
          <section class="hub-detail-rail hub-slide-over context" id="contextCol">
            <button type="button" class="hub-slide-over-close" id="contextMobileClose" aria-label="back to list">← back</button>
            <div class="hub-detail-rail-inner context-inner hub-t3p-context" id="contextDetail">
              <div class="hub-empty-state">Select a story.</div>
            </div>
          </section>
        </div>

      </div>
    </section>

  </div>

  <div class="news-scrim hub-t3p-scrim" id="newsScrim" hidden></div>

  <!-- ===== STATUS BAR ===== -->
  <footer class="status hub-t3p-status" id="status">
    <span class="status-l hub-t3p-status-l" id="statusMsg">ready</span>
    <span class="status-r hub-t3p-status-r" id="statusMeta"></span>
  </footer>

</div>

<script defer src="/jsx/news/frontend/static/news.jsx?v=5"></script>
<script>
/* load fallback: if the React body never mounted, say so instead of leaving a blank page */
window.addEventListener("load", function () {
  setTimeout(function () {
    if (document.querySelector('[data-react-mounted="news"]')) return;
    var host = document.getElementById("pane");
    if (host) host.innerHTML = '<div class="hub-error">page failed to load</div>';
  }, 3000);
});
</script>
</body>
</html>
