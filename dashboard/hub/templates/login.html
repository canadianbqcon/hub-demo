<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/static/assets/favicon.png" />
  <script>
    (function () {
      var r = document.documentElement;
      try {
        var t = localStorage.getItem("hub.theme");
        if (t === "glass") t = "liquid";
        r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
        if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
        var SK = "hub.surface"; /* "hub.surface" home/login · "hub:surface" jobs */
        var s = localStorage.getItem(SK);
        if (s !== "light" && s !== "dark") {
          s = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        r.setAttribute("data-surface", s);
      } catch (e) { r.setAttribute("data-theme", "liquid"); r.setAttribute("data-surface", "dark"); }
    })();
  </script>
  <title>HUB · locked</title>
  <!-- webfonts: one same-origin, render-blocking stylesheet carrying BOTH themes'
       faces. Replaces the Google Fonts <link> this head used to inject from JS:
       cross-origin, a second hop for each woff2, discovered too late to block
       first paint, and `display=swap` — so the page painted in the fallback stack
       and reflowed when the real faces landed. That reflow was the load flash.
       Declaring the inactive theme's faces costs nothing (a @font-face downloads
       only when a rule uses the family) and makes a live theme switch fetch-free,
       which is why window.HUB_FONTS is gone — theme-switch.js no-ops without it.
       See static/vendor/fonts/fonts.css; regenerate with tools/vendor-fonts.py. -->
  <link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
  <script>
    /* Preload the ACTIVE theme's two latin faces. Without this they are not
       discovered until fonts.css has parsed AND layout has reached text that uses
       them — late enough on a slow link to paint a frame in the fallback stack and
       reflow, which is the flash. Two files, ~40 KB. data-theme is already set by
       the no-flash snippet above, which is why this sits after it. */
    (function () {
      var FACES = {
        cobalt: ["/static/vendor/fonts/archivo-black-normal-latin.woff2",
                 "/static/vendor/fonts/space-grotesk-normal-latin.woff2"]
      };
      (FACES[document.documentElement.getAttribute("data-theme")] || []).forEach(function (href) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
        l.href = href;
        document.head.appendChild(l);
      });
    })();
  </script>
  <!-- cobalt theme fonts (brutalist grotesque pairing); inert unless data-theme="cobalt" -->
  <link rel="stylesheet" href="/static/css/base.css?v=6">
  <link rel="stylesheet" href="/static/css/components.css?v=5">
  <link rel="stylesheet" href="/static/css/themes/cobalt.css?v=2">
  <link rel="stylesheet" href="/static/css/themes/liquid.css?v=10">
  <script defer src="/static/js/theme-switch.js?v=42"></script><script defer src="/static/vendor/react.production.min.js"></script><script defer src="/static/vendor/react-dom.production.min.js"></script><script defer src="/jsx/static/js/topbar.jsx"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      background: radial-gradient(1200px 800px at 50% -10%, var(--bg-elev-2) 0%, var(--bg) 60%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }
    .wordmark {
      font-family: var(--font-display);
      font-weight: 300;
      font-size: var(--fs-large-title);
      letter-spacing: 0.02em;
      margin: 0 0 6px;
    }
    .tagline {
      color: var(--accent-dim);
      font-weight: 300;
      font-size: var(--fs-subhead);
      margin: 0 0 28px;
    }
    form { display: flex; flex-direction: column; gap: 12px; }
    input[type="password"] {
      width: 100%;
      padding: 13px 15px;
      font-size: var(--fs-body);
      font-family: inherit;
      color: var(--fg);
      background: color-mix(in srgb, var(--accent-dim) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-dim) 35%, transparent);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    input[type="password"]:focus {
      border-color: var(--warn);
      background: color-mix(in srgb, var(--warn) 10%, transparent);
    }
    input[type="password"]::placeholder { color: var(--accent-dim); opacity: 0.7; }
    button {
      padding: 13px 15px;
      font-size: var(--fs-subhead);
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--bg);
      background: linear-gradient(135deg, var(--warn) 0%, var(--warn-dim) 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: filter 0.15s ease;
    }
    button:hover { filter: brightness(1.07); }
    .error {
      color: var(--alert);
      font-size: var(--fs-footnote);
      min-height: 1.1em;
      margin: 4px 0 0;
    }
  </style>
</head>
<body>
  <!-- theme picker (top-right); theme-switch.js replaces the mount with the control -->
  <div style="position:fixed;top:14px;right:14px;z-index:50;">
    <div data-theme-picker></div>
  </div>
  <!-- the plain form is the no-JS page; login.jsx replaces it with the same markup -->
  <div class="card" id="login-root" data-error="{{ error or '' }}">
    <h1 class="wordmark">hub</h1>
    <p class="tagline">Enter the password to continue.</p>
    <form method="post" autocomplete="off">
      <input type="password" name="password" placeholder="Password" autofocus aria-label="Password" />
      <button type="submit">Unlock</button>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
    </form>
  </div>
  <script defer src="/public/login.jsx"></script>
</body>
</html>
