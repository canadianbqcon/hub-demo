<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/assets/favicon.png">
<!-- no-flash: set theme + surface before first paint (mirrors vault_map.html) -->
<script>
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem("hub.theme");
      if (t === "glass") t = "liquid";
      r.setAttribute("data-theme", (["cobalt","liquid"].indexOf(t) >= 0) ? t : "liquid");
      if (t === "liquid") r.setAttribute("data-glass", localStorage.getItem("hub.glass") === "solid" ? "solid" : "frost");
      var s = localStorage.getItem("hub.surface");
      if (s !== "light" && s !== "dark") {
        var old = localStorage.getItem("hub:surface");
        s = (old === "light" || old === "dark") ? old : "dark";
      }
      r.setAttribute("data-surface", s);
    } catch (e) { r.setAttribute("data-theme","cobalt"); r.setAttribute("data-surface","dark"); }
  })();
</script>
<title>capabilities</title>

<!-- webfonts: one same-origin, render-blocking stylesheet carrying BOTH themes'
     faces. Replaces the Google Fonts <link> this head used to inject from JS:
     cross-origin, a second hop for each woff2, discovered too late to block
     first paint, and `display=swap` — so the page painted in the fallback stack
     and reflowed when the real faces landed. That reflow was the load flash.
     Declaring the inactive theme's faces costs nothing (a @font-face downloads
     only when a rule uses the family) and makes a live theme switch fetch-free,
     which is why window.HUB_FONTS is gone — theme-switch.js no-ops without it.
     See static/vendor/fonts/fonts.css; regenerate with tools/vendor-fonts.py. -->
<link rel="stylesheet" href="/static/vendor/fonts/fonts.css?v=3">
<script>
  /* Preload the ACTIVE theme's two latin faces. Without this they are not
     discovered until fonts.css has parsed AND layout has reached text that uses
     them — late enough on a slow link to paint a frame in the fallback stack and
     reflow, which is the flash. Two files, ~40 KB. data-theme is already set by
     the no-flash snippet above, which is why this sits after it. */
  (function () {
    var FACES = {
      cobalt: ["/static/vendor/fonts/archivo-black-normal-latin.woff2",
               "/static/vendor/fonts/space-grotesk-normal-latin.woff2"]
    };
    (FACES[document.documentElement.getAttribute("data-theme")] || []).forEach(function (href) {
      var l = document.createElement("link");
      l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
      l.href = href;
      document.head.appendChild(l);
    });
  })();
</script>
<!-- Playfair Display / Source Serif 4 bundle removed 2026-07-24: unused by both
     themes this page loads (cobalt = Archivo Black/
     Space Grotesk) -- render-blocking dead weight, per critique minor finding. -->

<link rel="stylesheet" href="/static/css/base.css?v=6">
<link rel="stylesheet" href="/static/css/components.css?v=5">
<link rel="stylesheet" href="/static/css/themes/cobalt.css?v=2"><link rel="stylesheet" href="/static/css/themes/liquid.css?v=10"><script defer src="/hub-modules.js"></script><script defer src="/static/js/theme-switch.js?v=42"></script><script defer src="/static/vendor/react.production.min.js"></script><script defer src="/static/vendor/react-dom.production.min.js"></script><script defer src="/jsx/static/js/topbar.jsx"></script>

<style>
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:var(--font-body); font-size:var(--fs-subhead); line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
  }

  .topbar {
    display:flex; align-items:center; gap:var(--s-4,16px);
    padding:12px 18px; border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .spacer { flex:1 1 auto; }

  .searchbar { padding:12px 18px; border-bottom:1px solid var(--line-soft); flex:0 0 auto; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .searchbar input {
    width:100%; max-width:420px; background:var(--bg-elev); color:var(--fg);
    border:1px solid var(--line); border-radius:var(--r-card); padding:8px 12px;
    font-family:var(--font-body); font-size:var(--fs-footnote);
  }
  .searchbar input:focus { border-color:var(--accent-dim); }
  .searchbar .count { font-size:var(--fs-caption); color:var(--fg-dim); }
  .searchbar .toolbtn {
    box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center;
    height:var(--ctl-h); padding:0 10px; line-height:1; border:0; border-radius:var(--r-card);
    background:var(--bg-elev-2, var(--bg-elev)); color:var(--fg); font-family:var(--font-body);
    font-size:var(--fs-footnote); cursor:pointer;
  }
  .searchbar .toolbtn:hover { background:var(--bg-hover); }
  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .content { flex:1 1 auto; overflow-y:auto; padding:8px 18px 40px; }

  .agent { margin-top:22px; }
  .agent h2 {
    font-family:var(--font); font-weight:500; font-size:var(--fs-title); margin:0 0 10px;
    color:var(--fg); letter-spacing:.01em;
  }

  .group { margin-bottom:14px; border:1px solid var(--line-soft); border-radius:var(--r-card); overflow:hidden; }
  .group summary {
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    padding:9px 14px; background:var(--bg-elev); font-size:var(--fs-footnote); color:var(--fg-dim);
    letter-spacing:.03em; user-select:none;
  }
  .group summary::-webkit-details-marker { display:none; }
  .group summary .chev { color:var(--fg-dim); font-size:var(--fs-caption); transition:transform 100ms; }
  .group[open] summary .chev { transform:rotate(90deg); }
  .group summary .label {
    display:inline; margin:0; color:var(--fg);
    font-family:inherit; font-weight:inherit; font-size:inherit;
    line-height:inherit; letter-spacing:inherit;
  }
  .group summary .badge {
    margin-left:auto; font-size:var(--fs-caption); color:var(--fg-dim);
    font-variant-numeric:tabular-nums;
  }

  .row {
    display:flex; flex-direction:column; gap:2px;
    padding:9px 14px; border-top:1px solid var(--line-soft);
  }
  .row .nm { font-family:ui-monospace,monospace; font-size:var(--fs-footnote); color:var(--fg); }
  .row .ds { font-size:var(--fs-footnote); color:var(--fg-mute); line-height:1.5; }
  .row .pth { font-size:var(--fs-caption); color:var(--fg-dim); overflow-wrap:anywhere; }
  .row.hide { display:none; }
  .chip {
    display:inline-block; margin-left:8px; padding:1px 7px; border-radius:999px;
    font-size:var(--fs-caption); letter-spacing:.02em; vertical-align:middle;
    background:var(--bg-elev); border:1px solid var(--line); color:var(--fg-mute);
    font-family:var(--font-body);
  }

  /* Plugins sub-group renders inline as a continuation of the parent
     bucket's row list, not a nested box -- override .group's own
     border/radius/margin so it doesn't read as a box-in-a-box. */
  .plugin-group { margin:0; border:none; border-radius:0; overflow:visible; }
  .plugin-group summary {
    padding:9px 14px; font-size:var(--fs-footnote); color:var(--fg-dim);
    background:transparent; border-top:1px solid var(--line-soft);
  }
  .plugin-group .row { border-top:1px solid var(--line-soft); }

  .badgeline { display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--line-soft); font-size:var(--fs-footnote); }
  .badgeline .hub-dot { font-size:var(--fs-caption); color:var(--fg-dim); flex:0 0 auto; }
  .badgeline .pth { color:var(--fg-mute); overflow-wrap:anywhere; }

  .empty-state { padding:40px 18px; text-align:center; color:var(--fg-dim); font-size:var(--fs-footnote); }

  /* ---- cobalt brand pass: the topbar commits to thick 2px frames + hard
     offset shadows (see finances.css's identical [data-theme=cobalt] block
     for the source pattern) -- this page's own list was still a flat 1px
     generic admin panel. Page-owned override, frozen theme file untouched. */
  [data-theme="cobalt"] .group {
    border-width:2px; border-color:var(--line-strong);
    box-shadow:4px 4px 0 0 var(--fg);
  }
  /* plugin sub-groups render inline (see the .plugin-group comment above) --
     cancel the boxed-card treatment so they stay a flat continuation. */
  [data-theme="cobalt"] .plugin-group {
    border-width:0; box-shadow:none;
  }
  [data-theme="cobalt"] .group summary .label {
    font-family:var(--font); color:var(--violet-label);
    text-transform:uppercase; letter-spacing:.04em;
  }
  [data-theme="cobalt"] .row:hover {
    background:var(--accent-faint); border-left:3px solid var(--accent);
    padding-left:11px;
  }

  /* mobile tap target: 9px vertical padding + ~16px line-box is ~34px tall,
     under the 44px touch minimum -- desktop untouched. */
  @media (max-width: 768px) {
    .group summary { padding-top:14px; padding-bottom:14px; }
  }
</style>
</head>
<body>
  <h1 class="sr-only">Capabilities</h1>
    <header class="topbar">
    <!-- the bar itself (back, brand, toggle, theme, sign-out, modules) is drawn by
         topbar.jsx; only this page's extras live here, placed by data-slot -->
    <span data-slot="crumb" class="crumb">capabilities</span>
  </header>

  <div id="cap-root" style="display:contents"></div>

<script defer src="/jsx/capabilities/frontend/static/capabilities.jsx?v=1"></script>
<script>
/* fallback outside React: if the body never mounted, say so instead of a blank page */
window.addEventListener("load", function () {
  setTimeout(function () {
    if (document.querySelector('[data-react-mounted="capabilities"]')) return;
    var r = document.getElementById("cap-root");
    r.style.display = "block";
    r.innerHTML = '<div class="hub-error">page failed to load</div>';
  }, 3000);
});
</script>
</body>
</html>
