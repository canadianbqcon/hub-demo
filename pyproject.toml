# Vault-code lint config. The data-access modules build dynamic SQL by f-string
# (table/column names from internal callers or hardcoded allowlists; every VALUE
# bound via ? / :named placeholders), so ruff's S608 "possible SQL injection"
# heuristic fires on safe code. No user input reaches query structure anywhere
# (verified line-by-line 2026-06-11). S608 is ignored in those modules ONLY, so a
# future genuinely-unsafe query elsewhere still surfaces.
[tool.ruff.lint.extend-per-file-ignores]
# Triaged keeps from the 2026-06-12 code-audit warning review. The code-audit
# adapter forces `--select F,E,W,B,S,C901` on the CLI, and ruff lets CLI --select
# override config `ignore`/`extend-ignore` — but it MERGES config
# `extend-per-file-ignores` (verified: the catch-all "**/*.py" entry below
# survives the forced --select, same way the S608 entries already do). So the
# triaged-N/A rules are suppressed here, per-file. Each is genuinely not-applicable
# for this codebase, not a bug being hidden — see audit/2026-06-12-code-triage.md.
"**/*.py" = [
  "E501",  # line-length: not enforced here (cosmetic); 357 hits, all live code
  "E402",  # import-not-at-top: the deliberate flat-import layout (sys.path.insert
           # before `import db`), the same pattern pyrightconfig.json documents
  "S101",  # assert: post-INSERT type-narrows + test assertions; never a security
           # gate, so the strip-under-`-O` concern does not apply
  "S105",  # "hardcoded password": only hit is a dummy "test-token" in a mocked test
  "S310",  # urlopen audit: every call builds its URL from a hardcoded API host
           # (YNAB / Nominatim); no user input ever reaches the scheme
  "S603",  # subprocess untrusted input: single hit is a test with fixed args
]
# S110 (try-except-pass), S112 (try-except-continue), S104 (bind-all), and C901
# (complexity) are deliberately NOT ignored — they are baselined instead, so a
# genuinely NEW occurrence still surfaces for review.
# Imports its `client`/`vault` pytest fixtures from test_workbench_api.py; pytest
# injects them by parameter name, which ruff reads as redefining the import.
"dashboard/hub/tests/test_workbench_options.py" = ["F811"]
# 2026-10-15 code-audit test-file pass: test and sandbox-harness code only.
# S108: fixtures/harnesses deliberately use the fixed /tmp/hub-sandbox path (an
# isolated throwaway copy of the vault the sandbox hub is launched against); no
# shared-tmp attack surface. S106: dummy credential literals in fixtures.
# S607: harness shells out to `node`/`tmux` by name from PATH on the dev box.
# S608: tests build SQL from literal table names / placeholder lists, no input.
"dashboard/hub/tests/**/*.py" = ["S106", "S108", "S607", "S608"]
"tests/**/*.py" = ["S106", "S108", "S607", "S608"]
# Imports its `world` pytest fixture from test_trips_public.py; pytest injects it
# by parameter name, which ruff reads as redefining the import (same as above).
"dashboard/hub/tests/test_public_area.py" = ["F811"]
"**/db.py" = ["S608"]
"**/tasks.py" = ["S608"]
"**/scanner.py" = ["S608"]
"**/migrate_history.py" = ["S608"]
"**/reset_and_rebuild.py" = ["S608"]
"**/seed_cards.py" = ["S608"]
# 2026-09-24 code-audit fix pass: same shape as the entries above (table/column
# identifiers from schema/config or an allowlisted dict comprehension, every
# value bound via ? or :named placeholders; verified line-by-line per file).
"bin/db-compare.py" = ["S608"]
"bin/db-merge.py" = ["S608"]
"dashboard/hub/finances/owed.py" = ["S608"]
"dashboard/hub/finances/shift_calendar.py" = ["S608"]
"dashboard/hub/finances/trip_debts.py" = ["S608"]
"dashboard/hub/jobs/db_applications.py" = ["S608"]
"dashboard/hub/jobs/db_materials.py" = ["S608"]
"dashboard/hub/jobs/db_people.py" = ["S608"]
"dashboard/hub/jobs/db_process.py" = ["S608"]
# trips/db.py split into sections 2026-09-24 (Task 2 of the trips-split plan):
# same shape as the jobs db_* entries above, table names from a hardcoded
# allowlist/parameter, every value still bound via ? or :named placeholders.
"dashboard/hub/trips/db_trips.py" = ["S608"]
"dashboard/hub/trips/db_guests.py" = ["S608"]
"dashboard/hub/trips/db_prefs.py" = ["S608"]
"imessage/run.py" = ["S608"]
"imessage/watcher.py" = ["S608"]
# _SAMPLE is a real Amazon paste kept character-for-character (including one
# trailing space after "Sam Rivera") because the parser is verified against
# an actual paste's artifacts, not a cleaned-up approximation of one.
"dashboard/hub/purchases/orders_paste.py" = ["W291"]

[tool.vulture]
# Flask/Click register handlers by decorator (@app.route, @app.get, ...), not by a
# direct call, so vulture cannot trace the reference and flags every route + config
# attribute as dead at its lowest 60% tier. Raising the floor to 80 drops those 190
# false positives while keeping genuine dead code (90% + 100%, currently 6 items) —
# 2026-06-12 code-audit triage.
min_confidence = 80
# test_barback.py's `seeded_db` pytest fixture is consumed by every test purely for
# its setup side effect (seeding the sqlite file the module-level path points at) —
# never referenced by name in the test body, which is normal pytest fixture usage,
# not dead code. Vulture has no concept of fixture injection and flags all 26 uses
# at 100% confidence regardless of min_confidence. 2026-07-08 code-audit fix pass.
exclude = ["dashboard/hub/barback/test_barback.py"]

[tool.djlint]
# H030/H031 are SEO meta-description/keywords prompts; these dashboards are
# auth-gated and LAN/Tailscale-only, never crawled, so the rule's purpose is absent.
# H021 (inline styles) is the dashboard's own idiom. H023/H029 residual stay live.
# 2026-06-12 code-audit triage.
# H020 (empty tag pair) flags <ul></ul> / <tbody></tbody> containers that are
# intentionally empty on page load and populated by JS at runtime (e.g.
# finances.html's #by-source ul and #periods-table tbody, filled by finances.js).
# djlint has no concept of JS-hydrated templates. 2026-07-08 code-audit fix pass.
ignore = "H020,H021,H030,H031"
